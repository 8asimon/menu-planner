    <div class="cg cg-wide" style="gap:.35rem">
      <label class="switch"><input type="checkbox" ${S.hideChecked?'checked':''} onchange="S.hideChecked=this.checked;saveState();renderMarket()"> Ocultar lo ya comprado</label>
      ${pre||S.useInventory?`<label class="switch"><input type="checkbox" ${S.useInventory?'checked':''} onchange="S.useInventory=this.checked;saveState();renderMarket()"> Descontar lo que ya tengo en casa (${pre})</label>`:''}
    </div>
    <div style="display:flex;gap:.4rem;flex-wrap:wrap;margin-left:auto">
      <button class="btn btn-sm" onclick="expandAllMkt(true)">Contraer</button>
      <button class="btn btn-sm" onclick="expandAllMkt(false)">Expandir</button>
      <button class="btn btn-sm" onclick="clearMarket()">Desmarcar todo</button>
      <button class="btn btn-sm btn-primary" onclick="printMarket()">Imprimir</button>
    </div>
  </div>
  <div class="ctrl-bar" style="align-items:center;padding:.6rem 1rem;gap:.5rem">
    <span style="font-size:.76rem;color:var(--txt2)">🥬 Verduras y frutas:</span>
    <div class="seg">${[['mes','Mes completo'],['q1',`1ª quincena (${fmt(Q.q1.from)}–${fmt(Q.q1.to)})`],['q2',`2ª quincena (${fmt(Q.q2.from)}–${fmt(Q.q2.to)})`]].map(([k,l])=>`<button class="${vv===k?'active':''}" onclick="setVegView('${k}')">${l}</button>`).join('')}</div>
    <button class="btn btn-sm btn-primary" onclick="openWhatsappExport()" style="margin-left:auto">📲 Enviar por WhatsApp</button>
    <span style="font-size:.68rem;color:var(--txt3);width:100%">Proteínas y despensa siempre muestran el mes completo.</span>
  </div>
  <div class="progress-bar"><div class="progress-fill" style="width:${allKeys.length?Math.round(checked/allKeys.length*100):0}%"></div></div>
  <p style="font-size:.7rem;color:var(--txt3);margin:.3rem 0 .9rem;font-family:monospace">${checked}/${allKeys.length} comprados · toca un producto al echarlo al carrito (pasa al inventario)</p>`;

  groups.forEach(([store,cats])=>{
    const flat=cats.flatMap(([,it])=>it);
    const storeChecked=flat.filter(i=>S.marketChecked[i.key]).length;
    if(S.hideChecked&&storeChecked===flat.length)return;
    const storeOpen=S.mktCollapsed[store]!==true;
    html+=`<div class="mkt-store">
      <div class="mkt-store-hdr" data-k="${esc(store)}" onclick="toggleMktSection(this.dataset.k)">
        <span style="display:flex;align-items:center;gap:.4rem"><span class="mkt-store-chevron">${storeOpen?'▾':'▸'}</span><span class="mkt-store-name">${esc(store)}</span></span>
        <span class="mkt-cnt">${storeChecked}/${flat.length} ✓</span>
      </div>
      <div class="mkt-store-body${storeOpen?'':' collapsed'}">`;
    cats.forEach(([cat,items])=>{
      const vis=S.hideChecked?items.filter(i=>!S.marketChecked[i.key]):items;
      if(!vis.length)return;

      const catOpen=S.mktCollapsed[catKey]!==true;
      const catChecked=items.filter(i=>S.marketChecked[i.key]).length;
      const sorted=[...vis].sort((a,b)=>(a.minDate||pd).localeCompare(b.minDate||pd)||a.name.localeCompare(b.name,'es'));

          <div class="mkt-item-row1"><span class="mkt-item-name">${esc(item.name)}</span><span class="mkt-qty">${fmtQty(item)}</span></div>

    <span class="fresh-badge fresh-ok">0–3</span><span class="fresh-badge fresh-good">4–7</span><span class="fresh-badge fresh-warn">8–14</span><span class="fresh-badge fresh-crit">&gt;14 · mejor comprar después</span>
  </div>`;
  panel.innerHTML=html;
}

function toggleMarketItem(key){
  const base=key.split('@')[0],q=key.includes('@')?key.split('@')[1]:null;
  if(!S.marketChecked[key]){
    const Q=quincenas();
    const item=q&&Q?(computeMarketTotals(true,Q[q],'@'+q)[base]||computeMarketTotals(false,Q[q])[base]):(computeMarketTotals(true)[base]||computeMarketTotals(false)[base]);
    if(!item)return;
    const isP=isProteinCategory(item.tipo);
    const amt=isP?item.portionCount:(item.unit==='al gusto'?1:Math.round(item.qty*10)/10);
    const inv=S.inventory[base]||{name:item.name,qty:0,unit:isP?'porciones':item.unit,tipo:item.tipo};
    inv.qty=Math.round(((inv.qty||0)+amt)*10)/10;inv.purchased=true;
    S.inventory[base]=inv;S.marketBought[key]=amt;S.marketChecked[key]=true;
  } else {
    const amt=S.marketBought[key]||0,inv=S.inventory[base];
    if(inv){inv.qty=Math.round(((inv.qty||0)-amt)*10)/10;if(inv.qty<=0)delete S.inventory[base];}
    delete S.marketBought[key];delete S.marketChecked[key];
  }
  saveState();renderMarket();renderInventory();
}
function clearMarket(){
  const keys=Object.keys(S.marketChecked).filter(k=>S.marketChecked[k]);
  if(!keys.length)return;
  if(!confirm(`¿Desmarcar los ${keys.length} productos? También se quitan del inventario.`))return;
  keys.forEach(k=>{const b=k.split('@')[0],amt=S.marketBought[k]||0,inv=S.inventory[b];if(inv){inv.qty=Math.round(((inv.qty||0)-amt)*10)/10;if(inv.qty<=0)delete S.inventory[b];}});
  S.marketChecked={};S.marketBought={};saveState();renderMarket();renderInventory();
}

function toggleMktSection(key){
  if(!S.mktCollapsed)S.mktCollapsed={};
  // true = collapsed, undefined/false = open
  S.mktCollapsed[key]=!S.mktCollapsed[key];
  saveState();renderMarket();
}

function expandAllMkt(collapse){
  if(!S.mktCollapsed)S.mktCollapsed={};
  groupMarket(getMarketItems()).forEach(([st,cats])=>{S.mktCollapsed[st]=collapse;cats.forEach(([c])=>S.mktCollapsed[`${st}|${c}`]=collapse);});
  saveState();renderMarket();
}

function printMarket(){
  const totals=getMarketItems();
  let body=`<h2>Lista de mercado — ${fmtFull(S.purchaseDate||S.startDate||todayStr())}</h2>`;
  groupMarket(totals).forEach(([store,cats])=>{
    body+=`<h3>${esc(store)}</h3>`;
    cats.forEach(([cat,items])=>{
      body+=`<p class="cat">${esc(cat)}</p><ul>`;
      items.forEach(item=>{
        const chk=S.marketChecked[item.key];
        body+=`<li class="${chk?'done':''}">${chk?'☑':'☐'} ${esc(item.name)} <strong>${fmtQty(item)}</strong> <em>${freshnessInfo(item.minDate||S.purchaseDate,item.purchase).label}</em></li>`;
      });
      body+='</ul>';
    });
  });
  const w=window.open('','_blank');
  if(!w){toast('Permite ventanas emergentes para imprimir');return;}
  w.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Lista de mercado</title><style>body{font-family:Georgia,serif;padding:1.5rem;max-width:900px;margin:0 auto;font-size:12px}h3{margin:1rem 0 .4rem;border-bottom:1px solid #1D9E75;color:#0F6E56;padding-bottom:.2rem}.cat{font-size:10px;text-transform:uppercase;color:#888;margin:.4rem 0 .2rem;font-family:monospace}ul{list-style:none;padding:0;columns:2;column-gap:1.5rem}li{padding:2px 0;break-inside:avoid}li.done{text-decoration:line-through;color:#999}em{font-size:10px;color:#777}</style></head><body>${body}</body></html>`);
  w.document.close();setTimeout(()=>w.print(),400);
}

function pendingCooked(){
  const today=todayStr();let n=0;
  Object.keys(S.menu).filter(ds=>ds<=today).forEach(ds=>{const d=S.menu[ds];getDayMeals(ds).forEach(m=>{if(!(m.slot==='alm'?d.cookedAlm:d.cookedCena))n++;});});
  return n;
}
function renderInventory(){
  const inv=S.inventory;
  const panel=document.getElementById('panel-inventario');
  const pend=Object.keys(inv).length?pendingCooked():0;
  let html=`<div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:.9rem;flex-wrap:wrap;gap:.5rem">
    <div style="max-width:560px">
      <div class="section-ttl" style="margin:0">Lo que hay en casa</div>
      <p style="font-size:.76rem;color:var(--txt3);margin-top:.2rem">Se llena al marcar productos en 🛒 Mercado y baja al registrar lo cocinado. Lo que sobre se usa primero al proponer el siguiente menú. Proteínas en porciones.</p>
    </div>
    <div style="display:flex;gap:.4rem;flex-wrap:wrap">
      <button class="btn btn-sm btn-warn" onclick="openCookedModal()">🍳 Registrar lo cocinado${pend?` (${pend})`:''}</button>
      <button class="btn btn-sm" onclick="openAddInventory()">+ Agregar</button>
      ${Object.keys(inv).length?`<button class="btn btn-sm" onclick="clearInventory()">Vaciar</button>`:''}
    </div>
  </div>`;
  if(pend)html+=`<div class="notice" style="background:var(--amb-l);border-color:var(--amb);color:var(--amb)">Tienes ${pend} plato${pend>1?'s':''} de días pasados sin registrar. Regístralos para que el inventario quede al día.</div>`;
  if(!Object.keys(inv).length){
    html+='<div class="notice">Aún no hay inventario. Ve a 🛒 Mercado y toca cada producto cuando lo compres, o agrega a mano lo que ya tienes.</div>';
    panel.innerHTML=html;return;
  }
  const byTipo={};
  Object.entries(inv).forEach(([key,item])=>{(byTipo[item.tipo||'Otro']=byTipo[item.tipo||'Otro']||[]).push({key,...item});});
  const protPort=Object.values(inv).filter(i=>isProteinCategory(i.tipo)).reduce((a,i)=>a+(i.qty||0),0);
  html+=`<div class="stat-row"><div class="stat"><div class="stat-lbl">Productos</div><div class="stat-val">${Object.keys(inv).length}</div></div><div class="stat"><div class="stat-lbl">Porciones de proteína</div><div class="stat-val">${Math.round(protPort*10)/10}</div></div></div>`;
  html+=`<table class="inv-table"><thead><tr><th>Ingrediente</th><th class="hide-mobile">Categoría</th><th>En casa</th><th class="hide-mobile">Unidad</th><th></th></tr></thead><tbody>`;
  orderBy(CAT_PREF,Object.keys(byTipo)).forEach(cat=>{

    byTipo[cat].sort((a,b)=>a.name.localeCompare(b.name,'es')).forEach(item=>{
      const isP=isProteinCategory(item.tipo);
      const k=esc(item.key);
      html+=`<tr${(item.qty||0)<=0?' style="opacity:.5"':''}>
        <td>${esc(item.name)}</td>
        <td class="hide-mobile" style="color:var(--txt3);font-size:.76rem">${esc(item.tipo)}</td>
        <td><span class="stepper">${isP?`<button data-k="${k}" onclick="stepInventory(this.dataset.k,-1)">−</button>`:''}<input class="inv-input" type="number" min="0" step="${isP?1:0.1}" value="${item.qty||0}" data-k="${k}" onchange="updateInventory(this.dataset.k,this.value)">${isP?`<button data-k="${k}" onclick="stepInventory(this.dataset.k,1)">+</button>`:''}</span>
          <span style="font-size:.68rem;color:var(--txt3)">${isP?'porc.':`<span class="unit-mobile">${esc(item.unit)}</span>`}</span></td>
        <td class="hide-mobile" style="color:var(--txt3);font-size:.76rem;font-family:monospace">${esc(item.unit)}</td>
        <td><button class="btn btn-sm btn-danger" data-k="${k}" onclick="removeInventory(this.dataset.k)" title="Quitar">×</button></td>
      </tr>`;
    });
  });
  html+=`</tbody></table>`;
  panel.innerHTML=html;
}
function stepInventory(key,d){const it=S.inventory[key];if(!it)return;it.qty=Math.max(0,(it.qty||0)+d);saveState();renderInventory();}
function openAddInventory(){
  openModal(`<h2>Agregar al inventario</h2>
    <p style="font-size:.78rem;color:var(--txt2);margin-bottom:.8rem">Para lo que ya tienes en casa (por ejemplo, proteína que quedó en el congelador).</p>
    <div class="cg" style="margin-bottom:.6rem"><label>Ingrediente</label><input type="text" id="ai-name" list="ai-names" placeholder="ej: Pechuga de pollo" style="width:100%">
      <datalist id="ai-names">${[...new Set(Object.values({...RECETAS_BASE,...S.recetas}).flat().map(l=>l[0]))].sort().map(n=>`<option value="${esc(n)}">`).join('')}</datalist></div>
    <div style="display:flex;gap:.6rem;flex-wrap:wrap">
      <div class="cg"><label>Cantidad</label><input type="number" id="ai-qty" min="0" step="0.1" value="1" style="width:90px"></div>
      <div class="cg"><label>Unidad (proteína = porciones)</label><input type="text" id="ai-unit" value="unid" style="width:120px"></div>
    </div>
    <div class="modal-footer"><button class="btn btn-sm" onclick="closeModal()">Cancelar</button><button class="btn btn-sm btn-primary" onclick="saveAddInventory()">Agregar</button></div>`);
  const nm=document.getElementById('ai-name');
  nm.addEventListener('change',()=>{const l=findIngredient(nm.value);if(l){document.getElementById('ai-unit').value=isProteinCategory(l[3])?'porciones':l[2];}});
  setTimeout(()=>nm.focus(),50);
}
function findIngredient(name){const n=String(name).toLowerCase().trim();for(const r of Object.values({...RECETAS_BASE,...S.recetas})){const l=r.find(x=>String(x[0]).toLowerCase().trim()===n);if(l)return l;}return null;}
function saveAddInventory(){
  const name=document.getElementById('ai-name').value.trim();
  const qty=parseFloat(document.getElementById('ai-qty').value)||0;
  if(!name){toast('Escribe el ingrediente');return;}
  const l=findIngredient(name);const key=name.toLowerCase();
  const tipo=l?l[3]:'Otro';
  const unit=isProteinCategory(tipo)?'porciones':(document.getElementById('ai-unit').value.trim()||'unid');
  const it=S.inventory[key]||{name:l?l[0]:name,qty:0,unit,tipo};
  it.qty=Math.round(((it.qty||0)+qty)*10)/10;
  S.inventory[key]=it;closeModal();saveState();renderInventory();renderMarket();toast(`${it.name} agregado`);
}

function updateInventory(key,val){if(S.inventory[key])S.inventory[key].qty=Math.max(0,parseFloat(val)||0);saveState();}
function removeInventory(key){delete S.inventory[key];Object.keys(S.marketBought).forEach(k=>{if(k===key||k.startsWith(key+'@'))delete S.marketBought[k];});saveState();renderInventory();}
function clearInventory(){if(confirm('¿Vaciar todo el inventario?')){S.inventory={};S.marketBought={};S.marketChecked={};saveState();renderInventory();renderMarket();}}

// "Registrar cocinada" modal — pick dishes from this week, deduct ingredients
function openCookedModal(){
  const today=todayStr();
  const days=Object.keys(S.menu).sort().filter(ds=>ds<=today);
  let pending='',done=0;
  days.forEach(ds=>{
    const d=S.menu[ds];
    getDayMeals(ds).forEach(m=>{
      const isDone=m.slot==='alm'?d.cookedAlm:d.cookedCena;
      if(isDone){done++;return;}
      pending+=`<label class="checkbox-dish">
        <input type="checkbox" checked data-ds="${ds}" data-slot="${m.slot}">
        <span style="font-size:.7rem;color:var(--txt3);font-family:monospace;min-width:74px">${DAY_NAMES_SHORT[dayOfWeek(ds)]} ${fmt(ds)}</span>
        <span style="font-size:.66rem;color:var(--txt3);min-width:52px">${m.slot==='alm'?'almuerzo':'cena'}</span>
        <span>${esc(m.dish)}</span>
      </label>`;
    });
  });
  openModal(`<h2>🍳 Registrar lo cocinado</h2>
    <p style="font-size:.8rem;color:var(--txt2);margin-bottom:.9rem">Desmarca lo que no se preparó. Lo marcado se descuenta del inventario (1 porción de proteína por plato).</p>
    ${pending?`<div style="max-height:55vh;overflow-y:auto">${pending}</div>`:`<div class="notice">No hay platos pendientes hasta hoy.</div>`}
    ${done?`<p style="font-size:.72rem;color:var(--txt3);margin-top:.6rem">${done} plato${done>1?'s':''} ya registrado${done>1?'s':''}.</p>`:''}
    <div class="modal-footer">
      <button class="btn btn-sm" onclick="closeModal()">Cancelar</button>
      ${pending?`<button class="btn btn-primary btn-sm" onclick="applyCooked()">Registrar y descontar</button>`:''}
    </div>`);
}

function applyCooked(){
  const boxes=[...document.querySelectorAll('#modal-box input[type=checkbox]:checked')];
  let lines=0;
  boxes.forEach(cb=>{
    const ds=cb.dataset.ds,slot=cb.dataset.slot,d=S.menu[ds];if(!d)return;
    const m=getDayMeals(ds).find(x=>x.slot===slot);if(!m)return;
    m.lines.forEach(([ing,qty,,tipo])=>{
      const key=String(ing).toLowerCase().trim(),it=S.inventory[key];if(!it)return;
      it.qty=Math.max(0,Math.round(((it.qty||0)-(isProteinCategory(tipo)?1:qty))*10)/10);lines++;
    });
    if(slot==='alm')d.cookedAlm=true;else d.cookedCena=true;
  });
  closeModal();saveState();renderInventory();
  toast(boxes.length?`✓ ${boxes.length} plato${boxes.length>1?'s':''} registrado${boxes.length>1?'s':''}${lines?'':' (no había esos ingredientes en el inventario)'}`:'Nada seleccionado');
}

// ═══════════════════════════════════════════════════════════════
// QUANTITY INFERENCE
// ═══════════════════════════════════════════════════════════════
function inferQty(ingName,unit,tipo,recipeName){
  const lower=ingName.toLowerCase();
  // 1. Search existing recipes for same ingredient name
  for(const[rname,rec]of Object.entries({...RECETAS_BASE,...S.recetas})){
    if(rname===recipeName)continue;
    const match=rec.find(([ing])=>ing.toLowerCase()===lower);
    if(match&&match[1]>0)return{qty:match[1],unit:match[2]||unit};
  }
  // 2. Keyword defaults
  for(const[kw,qty]of Object.entries(QTY_DEFAULTS)){
    if(kw!=='_'&&lower.includes(kw)){
      const u=isProteinCategory(tipo)?'g':(unit||'unid');
      return{qty,unit:u};
    }
  }
  if(unit==='unid')return{qty:1,unit:'unid'};
  if(unit==='g')return{qty:100,unit:'g'};
  return{qty:QTY_DEFAULTS['_'],unit:unit||'unid'};
}

// ═══════════════════════════════════════════════════════════════
// RECIPES
// ═══════════════════════════════════════════════════════════════

let _recFilter='all',_recQuery='',_ed=null;
const TIPO_OPTS=['Pollo','Carne Cerdo','Carne Res','Pescado','Huevos','Lácteos','Carnes frías','Verdura','Fruta','Despensa','Congelados','Otro'];
const UNIT_OPTS=['g','ml','unid','kg','L','taza','lata','latas','pote','paquete','bolsa','manojo','rama','trozo','tajadas','tallos','botella','frasco','al gusto','media pechuga en mariposa','media pechuga sin porcionar','filetes','contramuslos','libra','cabeza','bifes de 200 g','porciones de lomo en mariposa','cañón de lomo de 500 g'];
function dishPools(name){return CATS.filter(c=>(S.platos[c]||[]).includes(name)||(S.platosFit[c]||[]).includes(name));}
function allDishNames(){
  const set=new Set([...Object.keys(RECETAS_BASE),...Object.keys(S.recetas)]);
  CATS.forEach(c=>{(S.platos[c]||[]).forEach(n=>set.add(n));(S.platosFit[c]||[]).forEach(n=>set.add(n));PLATOS_BASE[c].forEach(n=>set.add(n));});
  set.delete(SPECIAL_DISH);
  return [...set].sort((a,b)=>a.localeCompare(b,'es'));
}
function renderRecipes(){
  const panel=document.getElementById('panel-recetas');
  const filters=[['all','Todos'],['almuerzo_semana','Almuerzo semana'],['almuerzo_finde','Almuerzo finde'],['cena_semana','Cena semana'],['cena_finde','Cena finde'],['fit','Fit'],['mine','Propios / editados'],['off','Fuera de rotación']];
  panel.innerHTML=`<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.5rem">
      <div><div class="section-ttl" style="margin:0">Platos y recetas</div>
      <p style="font-size:.76rem;color:var(--txt3);margin-top:.2rem">Toca un plato para ver o ajustar sus ingredientes y en qué comidas puede salir. Las cantidades vacías se infieren de recetas parecidas.</p></div>
      <button class="btn btn-primary btn-sm" onclick="openRecipeEditor()">+ Nuevo plato</button>
    </div>
    <input class="search-input" type="search" placeholder="Buscar plato o ingrediente..." value="${esc(_recQuery)}" oninput="_recQuery=this.value;renderRecipeList()">
    <div class="rec-filters">${filters.map(([k,l])=>`<button class="rec-filter${_recFilter===k?' active':''}" onclick="_recFilter='${k}';renderRecipes()">${l}</button>`).join('')}</div>
    <div id="rec-count" style="font-size:.7rem;color:var(--txt3);margin-bottom:.4rem;font-family:monospace"></div>
    <div class="rec-list" id="rec-list"></div>`;
  renderRecipeList();
}
function renderRecipeList(){
  const el=document.getElementById('rec-list');if(!el)return;
  const words=norm(_recQuery).split(/\s+/).filter(Boolean);
  const short={almuerzo_semana:'Alm. sem',almuerzo_finde:'Alm. finde',cena_semana:'Cena sem',cena_finde:'Cena finde'};
  const list=allDishNames().filter(n=>{
    const pools=dishPools(n);
    if(_recFilter==='fit'&&!isFitDish(n))return false;
    if(CATS.includes(_recFilter)&&!pools.includes(_recFilter))return false;
    if(_recFilter==='mine'&&!S.recetas[n])return false;
    if(_recFilter==='off'&&pools.length)return false;
    if(words.length){const hay=norm(n+' '+(getReceta(n)||[]).map(l=>l[0]).join(' '));if(!words.every(w=>hay.includes(w)))return false;}
    return true;
  });
  document.getElementById('rec-count').textContent=`${list.length} platos`;
  el.innerHTML=list.length?list.map(n=>{
    const pools=dishPools(n),rec=getReceta(n);
    const tags=[...pools.map(c=>`<span class="badge" style="background:var(--surf2);color:var(--txt2)">${short[c]}</span>`)];
    if(isFitDish(n))tags.push('<span class="badge b-fit">fit</span>');
    if(S.recetas[n])tags.push(`<span class="badge" style="background:var(--amb-l);color:var(--amb)">${RECETAS_BASE[n]?'editado':'propio'}</span>`);
    if(!rec)tags.push('<span class="badge" style="background:var(--red-l);color:var(--red)">sin receta</span>');
    if(!pools.length)tags.push('<span class="badge" style="background:var(--surf3);color:var(--txt3)">fuera de rotación</span>');
    return `<div class="rec-row" data-n="${esc(n)}" onclick="openRecipeEditor(this.dataset.n)"><span class="rec-row-name">${esc(n)}<span style="font-size:.68rem;color:var(--txt3)"> · ${rec?rec.length:0} ingr.</span></span><span class="rec-row-tags">${tags.join('')}</span></div>`;
  }).join(''):'<div style="padding:1rem;font-size:.8rem;color:var(--txt3)">Sin resultados.</div>';
}

function blankIng(){return{ing:'',qty:'',unit:'unid',tipo:'Verdura',tienda:'Plaza'};}
function openRecipeEditor(name){
  const rec=name?(getReceta(name)||[]):[];
  const isBase=!!(name&&(RECETAS_BASE[name]||CATS.some(c=>PLATOS_BASE[c].includes(name)||PLATOS_FIT[c].includes(name))));
  _ed={orig:name||null,name:name||'',isBase,ings:rec.map(([ing,qty,unit,tipo,tienda])=>({ing,qty,unit,tipo,tienda})),pools:new Set(name?dishPools(name):[]),fit:name?isFitDish(name):false};
  if(!_ed.ings.length)_ed.ings.push(blankIng());
  renderRecipeEditor();
}
function renderRecipeEditor(){
  const e=_ed;
  const opts=(arr,v)=>{const a=arr.includes(v)||!v?arr:[...arr,v];return a.map(o=>`<option${o===v?' selected':''}>${esc(o)}</option>`).join('');};
  const stores=[...new Set([...STORE_PREF,'Otro',...Object.values({...RECETAS_BASE,...S.recetas}).flat().map(l=>l[4]).filter(Boolean)])];
  const names=[...new Set(Object.values({...RECETAS_BASE,...S.recetas}).flat().map(l=>l[0]))].sort((a,b)=>a.localeCompare(b,'es'));
  const curName=e.name;
  const rows=e.ings.map((g,i)=>{
    const inf=g.ing&&!(parseFloat(g.qty)>0)?inferQty(g.ing,g.unit,g.tipo,curName):null;
    return `<div class="ing-row">
      <input type="text" list="re-ings" placeholder="Ingrediente" value="${esc(g.ing)}" oninput="_ed.ings[${i}].ing=this.value;updateHint(${i})" onchange="autofillIng(${i})">
      <input type="number" id="ri-${i}-qty" min="0" step="any" placeholder="${inf?inf.qty:'cant.'}" value="${esc(g.qty)}" oninput="_ed.ings[${i}].qty=this.value;updateHint(${i})">
      <select id="ri-${i}-unit" onchange="_ed.ings[${i}].unit=this.value">${opts(UNIT_OPTS,g.unit)}</select>
      <select id="ri-${i}-tipo" class="ing-tipo" onchange="_ed.ings[${i}].tipo=this.value;if(STORE_BY_TIPO[this.value]){_ed.ings[${i}].tienda=STORE_BY_TIPO[this.value];const t=document.getElementById('ri-${i}-tienda');if(t){if(![...t.options].some(o=>o.value===STORE_BY_TIPO[this.value]))t.add(new Option(STORE_BY_TIPO[this.value]));t.value=STORE_BY_TIPO[this.value];}}updateHint(${i})">${opts(TIPO_OPTS,g.tipo)}</select>
      <select id="ri-${i}-tienda" class="ing-tienda" onchange="_ed.ings[${i}].tienda=this.value">${opts(stores,g.tienda)}</select>
      <button class="btn btn-sm btn-danger ing-del" onclick="_ed.ings.splice(${i},1);if(!_ed.ings.length)_ed.ings.push(blankIng());renderRecipeEditor()" title="Quitar">×</button>
    </div><div class="ing-hint" id="ri-${i}-hint">${inf?`sugerido: ${inf.qty} ${inf.unit}`:''}</div>`;
  }).join('');
  const edited=e.orig&&S.recetas[e.orig]&&RECETAS_BASE[e.orig];
  const usedIn=e.orig?Object.keys(S.menu).filter(ds=>S.menu[ds].almuerzo===e.orig||S.menu[ds].cena===e.orig).length:0;
  openModal(`<h2>${e.orig?'Plato':'Nuevo plato'}</h2>
    <div class="cg" style="margin-bottom:.7rem"><label>Nombre</label>
      <input type="text" id="re-name" value="${esc(curName)}" oninput="_ed.name=this.value" ${e.isBase?'readonly style="width:100%;opacity:.75"':'style="width:100%"'} placeholder="ej: Pollo al vino">
      ${usedIn?`<span style="font-size:.68rem;color:var(--txt3)">Aparece ${usedIn} ${usedIn>1?'veces':'vez'} en el menú actual</span>`:''}</div>
    <div class="section-ttl" style="margin-top:.2rem">Puede salir en</div>
    <div class="pool-checks">${CATS.map(c=>`<label class="switch"><input type="checkbox" ${e.pools.has(c)?'checked':''} onchange="this.checked?_ed.pools.add('${c}'):_ed.pools.delete('${c}')"> ${CAT_LABEL[c]}</label>`).join('')}
      <label class="switch"><input type="checkbox" ${e.fit?'checked':''} onchange="_ed.fit=this.checked"> Es plato fit</label></div>
    <div class="section-ttl">Ingredientes <span style="text-transform:none;letter-spacing:0;font-family:inherit;font-size:.68rem;color:var(--txt3)">— proteínas en gramos por plato</span></div>
    <datalist id="re-ings">${names.map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
    ${rows}
    <button class="btn btn-sm" onclick="_ed.ings.push(blankIng());renderRecipeEditor()" style="margin-top:.3rem">+ Ingrediente</button>
    <div class="modal-footer" style="flex-wrap:wrap">
      ${e.orig&&!e.isBase?`<button class="btn btn-sm btn-danger" onclick="deleteRecipe()" style="margin-right:auto">Eliminar</button>`:''}
      ${edited?`<button class="btn btn-sm" onclick="restoreRecipe()" style="margin-right:auto">Restaurar original</button>`:''}
      <button class="btn btn-sm" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-sm btn-primary" onclick="saveRecipeEditor()">Guardar</button>
    </div>`);
}
function updateHint(i){
  const g=_ed.ings[i],h=document.getElementById(`ri-${i}-hint`),q=document.getElementById(`ri-${i}-qty`);if(!h)return;
  const inf=g.ing&&!(parseFloat(g.qty)>0)?inferQty(g.ing,g.unit,g.tipo,_ed.name):null;
  h.textContent=inf?`sugerido: ${inf.qty} ${inf.unit}`:'';if(q)q.placeholder=inf?inf.qty:'cant.';
}
function autofillIng(i){
  const g=_ed.ings[i],l=findIngredient(g.ing);if(!l)return updateHint(i);
  g.unit=l[2];g.tipo=l[3];g.tienda=l[4]||g.tienda;
  const set=(f,v)=>{const el=document.getElementById(`ri-${i}-${f}`);if(!el)return;if(![...el.options].some(o=>o.value===v))el.add(new Option(v,v));el.value=v;};
  set('unit',g.unit);set('tipo',g.tipo);set('tienda',g.tienda);updateHint(i);
}
function setPools(name,pools,fit){
  CATS.forEach(c=>{
    const wantN=pools.has(c),wantF=pools.has(c)&&fit;
    S.platos[c]=(S.platos[c]||[]).filter(n=>n!==name);if(wantN)S.platos[c].push(name);
    S.platosFit[c]=(S.platosFit[c]||[]).filter(n=>n!==name);if(wantF)S.platosFit[c].push(name);
    S.excluded[c]=(S.excluded[c]||[]).filter(n=>n!==name);if(!wantN&&PLATOS_BASE[c].includes(name))S.excluded[c].push(name);
    S.excludedFit[c]=(S.excludedFit[c]||[]).filter(n=>n!==name);if(!wantF&&PLATOS_FIT[c].includes(name))S.excludedFit[c].push(name);
  });
}
function saveRecipeEditor(){
  const e=_ed,name=(e.name||'').trim();
  if(!name){toast('Escribe el nombre del plato');return;}
  if(name!==e.orig&&allDishNames().includes(name)){toast('Ya existe un plato con ese nombre');return;}
  const ings=e.ings.filter(g=>String(g.ing).trim()).map(g=>{const q=parseFloat(g.qty);return[String(g.ing).trim(),q>0?q:inferQty(g.ing,g.unit,g.tipo,name).qty,g.unit,g.tipo,g.tienda];});
  if(!ings.length){toast('Agrega al menos un ingrediente');return;}
  if(!e.pools.size&&!confirm('No marcaste en qué comidas puede salir. Quedará fuera de rotación. ¿Guardar así?'))return;
  if(e.orig&&e.orig!==name){
    delete S.recetas[e.orig];setPools(e.orig,new Set(),false);
    Object.values(S.menu).forEach(d=>{if(d.almuerzo===e.orig)d.almuerzo=name;if(d.cena===e.orig)d.cena=name;});
  }
  const base=RECETAS_BASE[name];
  if(base&&JSON.stringify(base)===JSON.stringify(ings))delete S.recetas[name];else S.recetas[name]=ings;
  setPools(name,e.pools,e.fit);
  Object.values(S.menu).forEach(d=>{if(d.almuerzo===name)d.fitAlm=e.fit;if(d.cena===name)d.fitCena=e.fit;});
  closeModal();saveState();renderAll();toast('✓ Plato guardado');
}
function restoreRecipe(){
  if(!confirm('¿Volver a los ingredientes originales de este plato?'))return;
  delete S.recetas[_ed.orig];saveState();renderAll();openRecipeEditor(_ed.orig);toast('Receta restaurada');
}
function deleteRecipe(){
  const n=_ed.orig;if(!confirm(`¿Eliminar "${n}"? Los días del menú que lo tengan quedarán sin lista de mercado.`))return;
  delete S.recetas[n];setPools(n,new Set(),false);closeModal();saveState();renderAll();toast('Plato eliminado');
}

(function(){
  const cfg=getGistConfig();
  if(cfg?.token&&cfg?.gistId)syncLoadFromGist(cfg,true);
  else setSyncStatus('noconf');

  document.addEventListener('visibilitychange',()=>{

    if(c?.token&&c?.gistId&&Date.now()-lastCheck>15000){lastCheck=Date.now();syncLoadFromGist(c,true);}
