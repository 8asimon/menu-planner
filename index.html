<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planificador de Menú</title>
<style>
:root{--bg:#f7f6f2;--surf:#fff;--surf2:#f0efe9;--surf3:#e8e7e0;--brd:rgba(0,0,0,.1);--brd2:rgba(0,0,0,.18);--txt:#1a1a18;--txt2:#5a5a56;--txt3:#9a9a94;--grn:#1D9E75;--grn-l:#E1F5EE;--grn-d:#0F6E56;--amb:#BA7517;--amb-l:#FAEEDA;--red:#A32D2D;--red-l:#FCEBEB;--blu:#185FA5;--blu-l:#E6F1FB;--r:10px;--rl:14px}
@media(prefers-color-scheme:dark){:root{--bg:#181816;--surf:#232320;--surf2:#2a2a27;--surf3:#333330;--brd:rgba(255,255,255,.08);--brd2:rgba(255,255,255,.15);--txt:#f0efe9;--txt2:#aaa9a2;--txt3:#6a6a64;--grn:#1D9E75;--grn-l:#04342C;--grn-d:#5DCAA5;--amb:#EF9F27;--amb-l:#412402;--red:#F09595;--red-l:#501313;--blu:#378ADD;--blu-l:#042C53}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Georgia,serif;background:var(--bg);color:var(--txt);font-size:15px;line-height:1.6;min-height:100vh}
header{background:var(--surf);border-bottom:.5px solid var(--brd2);padding:.9rem 1.5rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;gap:.5rem;flex-wrap:wrap}
header h1{font-size:1rem;font-weight:500;letter-spacing:-.02em}
header p{font-size:.72rem;color:var(--txt3);font-family:monospace}
.tabs{display:flex;background:var(--surf);border-bottom:.5px solid var(--brd);padding:0 1.5rem;overflow-x:auto}
.tab{padding:.65rem 1rem;font-size:.82rem;cursor:pointer;color:var(--txt3);border:none;border-bottom:2px solid transparent;margin-bottom:-.5px;background:none;font-family:inherit;white-space:nowrap;transition:all .15s}
.tab:hover{color:var(--txt)}.tab.active{color:var(--grn);border-bottom-color:var(--grn);font-weight:500}
.panel{display:none;padding:1.5rem;max-width:1150px;margin:0 auto}.panel.active{display:block}
.btn{padding:.4rem .9rem;border-radius:var(--r);border:.5px solid var(--brd2);font-size:.82rem;cursor:pointer;font-family:inherit;transition:all .15s;background:var(--surf);color:var(--txt)}
.btn:hover{background:var(--surf2)}.btn-primary{background:var(--grn);color:#fff;border-color:var(--grn-d)}.btn-primary:hover{background:var(--grn-d)}
.btn-danger{background:var(--red-l);color:var(--red);border-color:var(--red)}.btn-warn{background:var(--amb-l);color:var(--amb);border-color:var(--amb)}
.btn-sm{padding:.28rem .6rem;font-size:.74rem}
.ctrl-bar{background:var(--surf);border:.5px solid var(--brd);border-radius:var(--rl);padding:.9rem 1.1rem;margin-bottom:1.1rem;display:flex;align-items:flex-end;gap:.7rem;flex-wrap:wrap}
.cg{display:flex;flex-direction:column;gap:.3rem}
.cg label{font-size:.7rem;color:var(--txt3);text-transform:uppercase;letter-spacing:.06em;font-family:monospace}
select,input[type=number],input[type=text],input[type=date]{border:.5px solid var(--brd2);border-radius:var(--r);padding:.38rem .65rem;font-size:.84rem;background:var(--bg);color:var(--txt);font-family:inherit}
/* Calendar — week-by-week cards */
.week-card{background:var(--surf);border:.5px solid var(--brd);border-radius:var(--rl);margin-bottom:1rem;overflow:hidden}
.week-header{display:flex;align-items:center;justify-content:space-between;padding:.65rem 1rem;background:var(--surf2);border-bottom:.5px solid var(--brd)}
.week-title{font-size:.82rem;font-weight:500;font-family:monospace}
.week-progress{font-size:.72rem;color:var(--txt3);font-family:monospace}
.day-row{display:grid;grid-template-columns:80px 1fr 1fr;gap:0;border-bottom:.5px solid var(--brd)}
.day-row:last-child{border-bottom:none}
.day-row.confirmed-row{background:var(--grn-l)}
.day-row.wknd-row{background:color-mix(in srgb,var(--grn-l) 40%,var(--surf))}
.day-row.holi-row{background:var(--amb-l)}
.day-col-date{padding:.6rem .8rem;border-right:.5px solid var(--brd);display:flex;flex-direction:column;gap:.2rem;justify-content:center}
.day-col-date .dow{font-size:.68rem;color:var(--txt3);text-transform:uppercase;letter-spacing:.05em;font-family:monospace}
.day-col-date .dnum{font-size:.9rem;font-weight:500;font-family:monospace}
.day-col-date .dbadges{display:flex;flex-wrap:wrap;gap:2px;margin-top:.15rem}
.meal-cell{padding:.5rem .75rem;border-right:.5px solid var(--brd);display:flex;flex-direction:column;gap:.2rem}
.meal-cell:last-child{border-right:none}
.meal-cell-lbl{font-size:.62rem;text-transform:uppercase;letter-spacing:.04em;color:var(--txt3);display:flex;align-items:center;gap:.3rem}
.meal-cell-name{font-size:.78rem;color:var(--txt);line-height:1.35}
.meal-cell-actions{display:flex;gap:.3rem;margin-top:.2rem}
.act-btn{padding:.18rem .5rem;border-radius:6px;border:.5px solid var(--brd2);font-size:.68rem;cursor:pointer;font-family:inherit;background:var(--surf);color:var(--txt2);transition:all .12s}
.act-btn:hover{border-color:var(--grn);color:var(--grn);background:var(--grn-l)}
.act-btn.confirmed{background:var(--grn-l);color:var(--grn-d);border-color:var(--grn)}
.week-nav{display:flex;align-items:center;gap:.75rem;justify-content:center;margin-bottom:1rem}
.week-nav-btn{width:36px;height:36px;border-radius:50%;border:.5px solid var(--brd2);background:var(--surf);cursor:pointer;font-size:1.1rem;display:flex;align-items:center;justify-content:center;transition:all .15s}
.week-nav-btn:hover{background:var(--surf2);border-color:var(--brd2)}
.week-nav-btn:disabled{opacity:.3;cursor:default}
.week-dots{display:flex;gap:.4rem}
.week-dot{width:8px;height:8px;border-radius:50%;background:var(--surf3);cursor:pointer;transition:all .15s}
.week-dot.active{background:var(--grn)}
/* Suggestion chips */
.sugg-chip{display:inline-flex;padding:.28rem .7rem;border-radius:20px;border:.5px solid var(--brd2);font-size:.76rem;cursor:pointer;background:var(--surf2);color:var(--txt);transition:all .12s;margin:.2rem .2rem 0 0}
.sugg-chip:hover{border-color:var(--grn);background:var(--grn-l);color:var(--grn-d)}
.search-input{width:100%;border:.5px solid var(--brd2);border-radius:var(--r);padding:.4rem .7rem;font-size:.84rem;background:var(--bg);color:var(--txt);font-family:inherit;margin-top:.5rem}
.search-results{max-height:200px;overflow-y:auto;margin-top:.35rem;border:.5px solid var(--brd);border-radius:var(--r)}
.search-result-item{padding:.4rem .75rem;font-size:.8rem;cursor:pointer;border-bottom:.5px solid var(--brd);transition:background .1s}
.search-result-item:last-child{border-bottom:none}
.search-result-item:hover{background:var(--grn-l);color:var(--grn-d)}
.badge{font-size:.56rem;padding:1px 4px;border-radius:9px;font-family:monospace;white-space:nowrap}
.b-conf{background:var(--grn-l);color:var(--grn-d)}.b-holi{background:var(--amb-l);color:var(--amb)}
.b-fs{background:var(--grn-l);color:var(--grn-d)}.b-fit{background:var(--blu-l);color:var(--blu)}
/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;display:flex;align-items:center;justify-content:center;padding:1rem}
.modal{background:var(--surf);border-radius:var(--rl);border:.5px solid var(--brd2);padding:1.4rem;max-width:560px;width:100%;max-height:88vh;overflow-y:auto}
.modal h2{font-size:.97rem;font-weight:500;margin-bottom:.9rem}
.modal-footer{display:flex;gap:.5rem;justify-content:flex-end;margin-top:1.1rem;padding-top:.9rem;border-top:.5px solid var(--brd)}
/* Prep */
.prep-card{background:var(--surf);border:.5px solid var(--brd);border-radius:var(--rl);padding:1rem 1.2rem;margin-bottom:.7rem}
.prep-prot{font-size:.92rem;font-weight:500;color:var(--grn-d);display:flex;align-items:center;gap:.45rem;margin-bottom:.55rem}
.prep-dot{width:7px;height:7px;border-radius:50%;background:var(--grn);flex-shrink:0}
.prep-qty-tag{font-family:monospace;font-size:.74rem;background:var(--grn-l);color:var(--grn-d);padding:2px 8px;border-radius:20px;margin-left:auto}
.prep-dishes{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:.38rem;margin-top:.45rem}
.prep-dish{background:var(--surf2);border-radius:var(--r);padding:.4rem .65rem;font-size:.76rem;border-left:2px solid var(--grn)}
.mkt-store{background:var(--surf);border:.5px solid var(--brd2);border-radius:var(--rl);overflow:hidden;margin-bottom:.8rem}
.mkt-store-hdr{padding:.6rem 1rem;background:var(--surf2);border-bottom:.5px solid var(--brd);display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;transition:background .12s}
.mkt-store-hdr:hover{background:var(--surf3)}
.mkt-store-name{font-size:.86rem;font-weight:500}.mkt-cnt{font-size:.73rem;color:var(--txt3);font-family:monospace}
.mkt-store-chevron{font-size:.75rem;color:var(--txt3);transition:transform .2s;margin-left:.5rem}
.mkt-store-body{display:block}
.mkt-store-body.collapsed{display:none}
.mkt-cat{padding:.55rem 1rem;border-bottom:.5px solid var(--brd)}.mkt-cat:last-child{border-bottom:none}
.mkt-cat-hdr{display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;margin-bottom:.38rem;gap:.5rem}
.mkt-cat-hdr:hover .mkt-cat-name{color:var(--txt)}
.mkt-cat-name{font-size:.67rem;text-transform:uppercase;letter-spacing:.06em;color:var(--txt3);font-family:monospace;transition:color .12s}
.mkt-cat-chevron{font-size:.65rem;color:var(--txt3);transition:transform .2s;flex-shrink:0}
.mkt-cat-body{display:block}
.mkt-cat-body.collapsed{display:none}
.mkt-items{display:flex;flex-wrap:wrap;gap:.32rem}
.mkt-item{background:var(--surf2);border:.5px solid var(--brd);border-radius:20px;padding:.2rem .65rem;font-size:.76rem;display:flex;align-items:center;gap:.35rem;cursor:pointer;transition:all .15s;user-select:none}
.mkt-item:hover{border-color:var(--grn)}.mkt-item.checked{background:var(--grn-l);border-color:var(--grn);text-decoration:line-through;color:var(--txt3)}
.mkt-item-row1{display:flex;align-items:center;gap:.35rem;flex-wrap:wrap}
.mkt-qty{color:var(--grn-d);font-family:monospace;font-size:.7rem;font-weight:500}
.fresh-badge{font-size:.58rem;padding:1px 6px;border-radius:8px;font-family:monospace;font-weight:500;white-space:nowrap}
.fresh-ok{background:#E1F5EE;color:#0F6E56}.fresh-good{background:#EAF3DE;color:#3B6D11}
.fresh-warn{background:#FAEEDA;color:#854F0B}.fresh-crit{background:#FCEBEB;color:#791F1F}
/* Inventory */
.inv-table{width:100%;border-collapse:collapse;font-size:.8rem}
.inv-table th{text-align:left;padding:.45rem .7rem;font-size:.68rem;font-weight:500;color:var(--txt3);text-transform:uppercase;letter-spacing:.05em;border-bottom:.5px solid var(--brd2);font-family:monospace}
.inv-table td{padding:.45rem .7rem;border-bottom:.5px solid var(--brd)}.inv-table tr:last-child td{border-bottom:none}.inv-table tr:hover td{background:var(--surf2)}
.inv-input{border:.5px solid var(--brd2);border-radius:6px;padding:.22rem .45rem;font-size:.8rem;background:var(--bg);color:var(--txt);font-family:monospace;width:78px}
/* Recipe */
.recipe-card{background:var(--surf);border:.5px solid var(--brd);border-radius:var(--rl);padding:.9rem 1.15rem;margin-bottom:.55rem}
.recipe-name{font-size:.88rem;font-weight:500;margin-bottom:.38rem;display:flex;align-items:center;justify-content:space-between}
.recipe-ing{display:flex;flex-wrap:wrap;gap:.28rem}
.recipe-ing-tag{background:var(--surf2);border-radius:20px;padding:.13rem .55rem;font-size:.7rem;color:var(--txt2)}
/* Misc */
.section-ttl{font-size:.76rem;color:var(--txt2);text-transform:uppercase;letter-spacing:.08em;margin:1.2rem 0 .6rem;font-family:monospace}
.notice{background:var(--blu-l);border:.5px solid var(--blu);border-radius:var(--r);padding:.6rem .9rem;font-size:.79rem;color:var(--blu);margin-bottom:.9rem}
.progress-bar{height:5px;background:var(--surf3);border-radius:3px;overflow:hidden;margin:.4rem 0}
.progress-fill{height:100%;background:var(--grn);border-radius:3px;transition:width .3s}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:.55rem;margin-bottom:1.1rem}
.stat{background:var(--surf2);border-radius:var(--r);padding:.65rem .9rem}
.stat-lbl{font-size:.66rem;color:var(--txt3);text-transform:uppercase;letter-spacing:.05em;font-family:monospace}
.stat-val{font-size:1.25rem;font-weight:500;margin-top:.12rem}
.week-label{font-size:.72rem;font-family:monospace;color:var(--txt3);margin-bottom:.3rem;padding:.2rem .5rem;background:var(--surf2);border-radius:6px;display:inline-block}
input[type=range]{accent-color:var(--grn)}
.checkbox-dish{display:flex;align-items:center;gap:.5rem;padding:.35rem .5rem;border-radius:var(--r);cursor:pointer;font-size:.82rem}
.checkbox-dish:hover{background:var(--surf2)}
.checkbox-dish input{width:15px;height:15px;cursor:pointer;accent-color:var(--grn)}

/* ── RESPONSIVE ──────────────────────────────────────── */
@media(max-width:640px){
  /* Header */
  header{padding:.65rem .9rem;gap:.4rem}
  header h1{font-size:.88rem}
  header p{font-size:.65rem}
  header .btn-sm{padding:.3rem .6rem;font-size:.72rem}

  /* Tabs — emoji only, larger touch target */
  .tabs{padding:0;justify-content:stretch}
  .tab{flex:1;padding:.65rem .3rem;font-size:1rem;text-align:center}
  .tab .tab-label{display:none}

  /* Panels */
  .panel{padding:.9rem .7rem}

  /* Control bar stacks vertically */
  .ctrl-bar{flex-direction:column;align-items:stretch;gap:.55rem;padding:.8rem .9rem}
  .ctrl-bar .cg,.ctrl-bar select,.ctrl-bar input[type=date],.ctrl-bar input[type=number],.ctrl-bar input[type=range]{width:100%}

  /* ── Calendar review ── */
  .day-row{grid-template-columns:56px 1fr;grid-template-rows:auto auto}
  .day-col-date{grid-row:1/3;border-right:.5px solid var(--brd);padding:.5rem .5rem}
  .day-col-date .dow{font-size:.62rem}
  .day-col-date .dnum{font-size:.85rem}
  .meal-cell{border-right:none;border-bottom:.5px solid var(--brd);padding:.45rem .65rem}
  .meal-cell:last-child{border-bottom:none}
  .meal-cell-name{font-size:.8rem}
  .meal-cell-actions{display:flex;gap:.4rem;margin-top:.3rem}
  .act-btn{flex:1;padding:.32rem .4rem;font-size:.72rem;min-height:34px;text-align:center;justify-content:center}
  .week-nav-btn{width:44px;height:44px;font-size:1.3rem}
  .week-dot{width:11px;height:11px}

  /* ── Market ── */
  /* Store header: bigger, easy tap */
  .mkt-store-hdr{padding:.75rem .9rem}
  .mkt-store-name{font-size:.9rem}
  .mkt-store-chevron{font-size:.9rem}
  /* Category header */
  .mkt-cat{padding:.5rem .9rem}
  .mkt-cat-hdr{margin-bottom:.45rem}
  .mkt-cat-name{font-size:.7rem}
  /* Items: 2-line card layout on mobile */
  .mkt-items{flex-direction:column;gap:.35rem}
  .mkt-item{
    border-radius:var(--r);
    padding:.5rem .8rem;
    flex-direction:column;
    align-items:flex-start;
    gap:.25rem;
    min-height:52px;
  }
  .mkt-item-row1{display:flex;align-items:center;justify-content:space-between;width:100%}
  .mkt-item-name{font-size:.85rem;font-weight:500}
  .mkt-qty{font-size:.78rem}
  .fresh-badge{font-size:.65rem;padding:2px 7px;align-self:flex-start}
  .mkt-item.checked{opacity:.6}

  /* ── Resumen list ── */
  #resumen-grid{display:none}
  #resumen-list{display:block}
  .resumen-day-card{
    background:var(--surf);
    border:.5px solid var(--brd);
    border-radius:var(--r);
    margin-bottom:.5rem;
    overflow:hidden;
  }
  .resumen-day-hdr{
    padding:.45rem .8rem;
    background:var(--surf2);
    border-bottom:.5px solid var(--brd);
    display:flex;align-items:center;justify-content:space-between;
  }
  .resumen-day-name{font-size:.78rem;font-weight:500}
  .resumen-day-date{font-size:.68rem;color:var(--txt3);font-family:monospace}
  .resumen-day-body{padding:.5rem .8rem;display:grid;grid-template-columns:1fr 1fr;gap:.4rem}
  .resumen-slot-lbl{font-size:.6rem;text-transform:uppercase;letter-spacing:.04em;color:var(--txt3);margin-bottom:.15rem}
  .resumen-slot-txt{font-size:.78rem;line-height:1.35;color:var(--txt)}

  /* ── Stat row ── */
  .stat-row{grid-template-columns:1fr 1fr}

  /* ── Modal: full-screen bottom sheet on mobile ── */
  .modal-overlay{
    padding:0;
    align-items:flex-end;
  }
  .modal{
    width:100%;
    max-width:100%;
    max-height:92vh;
    border-radius:var(--rl) var(--rl) 0 0;
    padding:1rem 1rem 1.25rem;
    /* handle bar */
    border-top:.5px solid var(--brd2);
  }
  .modal::before{
    content:'';
    display:block;
    width:36px;height:4px;
    background:var(--surf3);
    border-radius:2px;
    margin:0 auto .9rem;
  }
  .modal h2{font-size:.92rem;margin-bottom:.65rem}
  /* Suggestions: scrollable horizontal row */
  #sugg-container{
    display:flex;
    flex-wrap:nowrap;
    overflow-x:auto;
    gap:.4rem;
    padding-bottom:.4rem;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  #sugg-container::-webkit-scrollbar{display:none}
  .sugg-chip{
    flex-shrink:0;
    font-size:.8rem;
    padding:.38rem .85rem;
    max-width:240px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  /* Search results taller for thumb scrolling */
  .search-results{max-height:220px}
  .search-result-item{padding:.55rem .85rem;font-size:.84rem;min-height:44px;display:flex;align-items:center}
  .search-input{font-size:.88rem;padding:.5rem .75rem}
  .modal-footer{padding-top:.75rem;margin-top:.75rem}
  .modal-footer .btn{min-height:40px;font-size:.82rem;flex:1}

  /* Prep */
  .prep-dishes{grid-template-columns:1fr}
  .prep-card{padding:.8rem 1rem}

  /* Inventory table: hide less-important cols */
  .inv-table .hide-mobile{display:none}
  .inv-input{width:58px}
}
@media(min-width:641px){.unit-mobile{display:none}}

/* Desktop: restore */
@media(min-width:641px){
  .tab .tab-label{display:inline}
  #resumen-grid{display:grid}
  #resumen-list{display:none}
  .inv-table .hide-mobile{display:table-cell}
  .mkt-items{flex-direction:row}
  .mkt-item{flex-direction:row;align-items:center}
  .mkt-item-row1{flex:1;flex-wrap:nowrap}
  .mkt-item-name{font-size:.76rem}
}

/* Tablet */
@media(min-width:641px) and (max-width:900px){
  .day-row{grid-template-columns:65px 1fr 1fr}
  .panel{padding:1.25rem 1rem}
}
/* ── v5 additions ── */
.seg{display:inline-flex;flex-wrap:wrap;border:.5px solid var(--brd2);border-radius:var(--r);overflow:hidden}
.seg button{border:none;background:var(--surf);padding:.35rem .7rem;font-size:.74rem;cursor:pointer;font-family:inherit;color:var(--txt2);border-right:.5px solid var(--brd)}
.seg button:last-child{border-right:none}
.seg button.active{background:var(--grn);color:#fff}
#toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%) translateY(150%);background:var(--txt);color:var(--bg);padding:.55rem 1rem;border-radius:20px;font-size:.8rem;z-index:900;transition:transform .25s;max-width:90vw;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.2)}
#toast.show{transform:translateX(-50%) translateY(0)}
.dish-link{cursor:pointer;border-radius:4px;transition:background .12s}
.dish-link:hover{background:var(--grn-l)}
.week-mix{display:flex;flex-wrap:wrap;gap:.3rem;padding:.45rem 1rem;border-bottom:.5px solid var(--brd);font-size:.68rem;color:var(--txt3);align-items:center}
.mix-chip{background:var(--surf2);border-radius:10px;padding:1px 7px;font-family:monospace;color:var(--txt2)}
.mix-chip.warn{background:var(--amb-l);color:var(--amb)}
.opt-list{display:flex;flex-direction:column;gap:.4rem}
.opt-item{display:flex;align-items:center;gap:.7rem;padding:.65rem .8rem;border:.5px solid var(--brd2);border-radius:var(--r);background:var(--surf);cursor:pointer;font-family:inherit;font-size:.84rem;color:var(--txt);text-align:left;width:100%}
.opt-item:hover{background:var(--surf2)}
.opt-item small{display:block;font-size:.7rem;color:var(--txt3)}
.opt-item.danger{color:var(--red)}
.cg label.switch{text-transform:none;letter-spacing:0;font-family:inherit;font-size:.78rem;color:var(--txt2)}

// ═══════════════════════════════════════════════════════════════
// FESTIVOS COLOMBIA
// ═══════════════════════════════════════════════════════════════
function colombianHolidays(yr){
  function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d2=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d2-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),dy=((h+l-7*m+114)%31)+1;return new Date(y,mo-1,dy)}
  function nxtMon(s){const d=new Date(s+'T12:00:00'),dw=d.getDay();if(dw===1)return s;const df=dw===0?1:8-dw;d.setDate(d.getDate()+df);return d.toISOString().slice(0,10)}
  function addD(base,n){const r=new Date(base);r.setDate(r.getDate()+n);return r.toISOString().slice(0,10)}
  const P=easter(yr),Ps=P.toISOString().slice(0,10);
  const fixed=[`${yr}-01-01`,`${yr}-05-01`,`${yr}-07-20`,`${yr}-08-07`,`${yr}-12-08`,`${yr}-12-25`];
  const emi=[`${yr}-01-06`,`${yr}-03-19`,`${yr}-06-29`,`${yr}-08-15`,`${yr}-10-12`,`${yr}-11-01`,`${yr}-11-11`].map(nxtMon);
  const mov=[addD(P,-3),addD(P,-2),nxtMon(addD(P,39)),nxtMon(addD(P,60)),nxtMon(addD(P,68))];
  const nameMap={[`${yr}-01-01`]:'Año Nuevo',[`${yr}-05-01`]:'Día del Trabajo',[`${yr}-07-20`]:'Independencia',[`${yr}-08-07`]:'Boyacá',[`${yr}-12-08`]:'Inmaculada',[`${yr}-12-25`]:'Navidad',[addD(P,-3)]:'Jue Santo',[addD(P,-2)]:'Vie Santo',[nxtMon(addD(P,39))]:'Ascensión',[nxtMon(addD(P,60))]:'Corpus Christi',[nxtMon(addD(P,68))]:'Sdo Corazón'};
  const emiNames=['Reyes Magos','San José','San Pedro y San Pablo','Asunción','Día de la Raza','Todos los Santos','Ind. Cartagena'];
  emi.forEach((d,ix)=>{if(!nameMap[d])nameMap[d]=emiNames[ix]||'Festivo'});
  const all=new Set([...fixed,...emi,...mov]);
  return{has:d=>all.has(d),name:d=>nameMap[d]||'Festivo'};
}

  const ent=Object.entries(SOBRAS_CENA).find(([,c])=>c===cena);

// Crema de leche siempre en gramos (cantidades definidas por Simón)
const CREMA_G={'Crema de tomate':50,'Parmontier':150,'Musaka de plátano':100,'Sopa de Ahuyama':50,'Sopa de Espinaca':50,'Pastas Del huerto':300,'Pastas Jamón y crema':300,'Pastas Lasaña':200};
function cremaToGrams(name,lines){
  (lines||[]).forEach(l=>{
    if(String(l[0]).toLowerCase()!=='crema leche'||l[2]==='g')return;
    let g=CREMA_G[name];
    if(g==null&&/gratin dauphinois/i.test(name))g=500;
    if(g==null&&/papa chorreada/i.test(name))g=300;
    if(g==null)g=Math.round((Number(l[1])||1)*200);
    l[1]=g;l[2]='g';
  });
}
Object.entries(RECETAS_BASE).forEach(([n,r])=>cremaToGrams(n,r));

// ═══════════════════════════════════════════════════════════════
const GIST_FILENAME = 'menu_planner_state.json';
const LS_KEY = 'menuapp_v6';
const LS_GIST_KEY = 'menuapp_gist_config'; // {token, gistId}

let _syncStatus = 'idle'; // idle | saving | loading | error | ok
let _syncTimeout = null;

function getGistConfig(){ try{return JSON.parse(localStorage.getItem(LS_GIST_KEY)||'null');}catch(e){return null;} }
function setGistConfig(cfg){ localStorage.setItem(LS_GIST_KEY, JSON.stringify(cfg)); }

function setSyncStatus(status, msg=''){
  _syncStatus = status;
  const el = document.getElementById('sync-status');
  if(!el) return;
  const map = {
    idle:    ['',''],
    saving:  ['⟳ Guardando...','color:var(--txt3)'],
    loading: ['⟳ Cargando...','color:var(--txt3)'],
    ok:      ['✓ Sincronizado','color:var(--grn)'],
    error:   ['⚠ '+msg,'color:var(--amb)'],
    noconf:  ['☁ Sin configurar','color:var(--txt3)']
  };
  const [text, style] = map[status]||['',''];
  el.textContent = text;
  el.setAttribute('style', `font-size:.68rem;font-family:monospace;cursor:pointer;${style}`);
}

// Save to localStorage immediately, then debounce Gist save
function saveState(){
  S.updatedAt=Date.now();
  try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){}
  scheduleSyncSave();
}

function scheduleSyncSave(){
  const cfg = getGistConfig();
  if(!cfg?.token || !cfg?.gistId){ setSyncStatus('noconf'); return; }
  setSyncStatus('saving');
  clearTimeout(_syncTimeout);
  _syncTimeout = setTimeout(()=>syncSaveToGist(cfg), 1500); // debounce 1.5s
}

async function syncSaveToGist(cfg){
  try{
    const payload = {
      description: 'Menu Planner State',
      files:{ [GIST_FILENAME]:{ content: JSON.stringify(S) } }
    };
    const res = await fetch(`https://api.github.com/gists/${cfg.gistId}`,{
      method:'PATCH',
      headers:{'Authorization':`token ${cfg.token}`,'Content-Type':'application/json'},
      body: JSON.stringify(payload)
    });
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    _syncTimeout=null;
    setSyncStatus('ok');
    // Auto-clear ok after 3s
    setTimeout(()=>{ if(_syncStatus==='ok') setSyncStatus('idle'); },3000);
  }catch(e){
    setSyncStatus('error', 'Error al guardar');
    console.error('Gist save error:', e);
  }
}

async function syncLoadFromGist(cfg, silent=false, force=false){
  if(_syncTimeout && !force) return; // hay un guardado pendiente: lo local es más nuevo
  if(!silent) setSyncStatus('loading');
  try{
    const res = await fetch(`https://api.github.com/gists/${cfg.gistId}`,{
      headers:{'Authorization':`token ${cfg.token}`},cache:'no-store'
    });
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    let content = data.files?.[GIST_FILENAME]?.content;
    if(data.files?.[GIST_FILENAME]?.truncated){ const r2=await fetch(data.files[GIST_FILENAME].raw_url,{cache:'no-store'}); content=await r2.text(); }
    if(!content){ // Gist nuevo y vacío: subir lo local
      await syncSaveToGist(cfg); return;
    }
    const remote = JSON.parse(content);
    const remoteT=remote.updatedAt||0, localT=S.updatedAt||0;
    if(!force && localT>remoteT){ await syncSaveToGist(cfg); return; }
    if(force || remoteT>localT){
      Object.assign(S, remote);
      migrateState();
      try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){}
      renderAll();
      if(!silent) toast('Menú actualizado desde la nube');
    }
    setSyncStatus('ok');
    setTimeout(()=>{ if(_syncStatus==='ok') setSyncStatus('idle'); },3000);
  }catch(e){
    setSyncStatus('error', 'Sin conexión a la nube');
    console.error('Gist load error:', e);
  }
}

function loadState(){
  try{const d=localStorage.getItem(LS_KEY);if(d){const p=JSON.parse(d);Object.assign(S,p);}}catch(e){}
  migrateState();
  if(!S.startDate)S.startDate=todayStr();
  if(!S.purchaseDate)S.purchaseDate=S.startDate;

function importMenu(){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json,application/json';
  input.onchange = e => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try{
        const data = JSON.parse(ev.target.result);
        if(!data.menu) throw new Error('El archivo no parece un respaldo del planificador');
        if(!confirm(`¿Importar el respaldo (menú desde ${data.startDate||'?'})? Reemplaza lo que tienes ahora.`)) return;
        delete data.version; delete data.exportedAt;
        Object.assign(S, data);

        saveState();
        renderAll();
        toast('✓ Respaldo importado');
      }catch(err){
        toast('No se pudo importar: '+err.message,4000);
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

function pad(n){return String(n).padStart(2,'0')}
function todayStr(){const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function norm(v){return String(v||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim()}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function enc(v){return encodeURIComponent(v)}
function toast(msg,ms=2800){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t);}t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),ms);}

function addDays(ds,n){const d=new Date(ds+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function dayOfWeek(ds){return new Date(ds+'T12:00:00').getDay()} // 0=Sun
function fmt(ds){const[y,m,d]=ds.split('-');const mn=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];return`${parseInt(d)} ${mn[parseInt(m)-1]}`}
function fmtFull(ds){const[y,m,d]=ds.split('-');const mn=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];return`${parseInt(d)} de ${mn[parseInt(m)-1]} de ${y}`}

function getHols(){
  // collect all years in current window
  const years=new Set();
  if(S.startDate)years.add(parseInt(S.startDate.slice(0,4)));
  const end=addDays(S.startDate||todayStr(),35);
  years.add(parseInt(end.slice(0,4)));
  const merged={has:d=>[...years].some(y=>colombianHolidays(y).has(d)),name:d=>{for(const y of years){const h=colombianHolidays(y);if(h.has(d))return h.name(d);}return'Festivo'}};
  return merged;
}

// Período: completa la semana de inicio (hasta el domingo) + 4 semanas lun–dom
function periodDays(start){const dw=dayOfWeek(start);if(dw===1)return 28;return (dw===0?1:8-dw)+28;}
function firstMonday(start){const dw=dayOfWeek(start);return dw===1?start:addDays(start,dw===0?1:8-dw);}
function menuDates(){return Object.keys(S.menu).sort();}
function periodEnd(){const d=menuDates();return d.length?d[d.length-1]:addDays(S.startDate||todayStr(),periodDays(S.startDate||todayStr())-1);}
function mondayOf(ds){return addDays(ds,-((dayOfWeek(ds)+6)%7));}
function getWeeks(){const g={};menuDates().forEach(ds=>{(g[mondayOf(ds)]=g[mondayOf(ds)]||[]).push(ds);});return Object.keys(g).sort().map(k=>g[k]);}
function hasStub(){const w=getWeeks();return w.length>0&&dayOfWeek(w[0][0])!==1;}
function weekName(i){return hasStub()?(i===0?'Arranque':`Semana ${i}`):`Semana ${i+1}`;}
// Quincenas (para verduras): Q1 = arranque + semanas 1–2, Q2 = semanas 3–4
function quincenas(){const d=menuDates();if(!d.length)return null;const cut=addDays(firstMonday(S.startDate),14);
  return{q1:{from:d[0],to:addDays(cut,-1)},q2:{from:cut,to:d[d.length-1]}};}
function weekIndexOf(ds){return getWeeks().findIndex(w=>w.includes(ds));}

function isWeekend(ds,hols){const dw=dayOfWeek(ds);return dw===0||dw===6||hols.has(ds)}
function isFriday(ds){return dayOfWeek(ds)===5}
function pickRandom(arr,last){const f=arr.filter(x=>x!==last);return f.length?f[Math.floor(Math.random()*f.length)]:(arr.length?arr[Math.floor(Math.random()*arr.length)]:'');}

const DAY_NAMES_SHORT=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];

// ═══════════════════════════════════════════════════════════════
// GENERATE — rolling 28-day window from startDate
// ═══════════════════════════════════════════════════════════════
function buildMixedPool(normal,fit,pct){
  if(pct<=0)return normal;if(pct>=100)return fit.length?fit:normal;
  return{normal,fit,pct};
}
function pickFromMixed(pool,last){
  if(!pool||Array.isArray(pool))return pickRandom(pool||[],last);
  const useFit=Math.random()*100<pool.pct;
  return pickRandom((useFit&&pool.fit.length)?pool.fit:pool.normal,last);
}

function isFitDish(d){return CATS.some(c=>(S.platosFit[c]||[]).includes(d));}

// Elige un plato del pool respetando: no repetir, límites de proteína, % fit,
// sobrantes en casa y variedad (menos usados / no usados recientemente)
function smartPick(pool,last,ctx){
  const all=[...new Set(Array.isArray(pool)?pool:[...pool.normal,...pool.fit])].filter(Boolean);
  if(!all.length)return '';
  const narrow=(arr,fn)=>{const f=arr.filter(fn);return f.length?f:arr;};
  let c=narrow(all,d=>d!==last);
  if(ctx.familyCounts)c=narrow(c,d=>{const f=getDishFamily(d);return (ctx.familyCounts[f]||0)<(ctx.maxFamily[f]??99);});
  const lastFam=getDishFamily(last);
  if(lastFam!=='Otro')c=narrow(c,d=>getDishFamily(d)!==lastFam);
  if(ctx.avoidFam&&ctx.avoidFam!=='Otro')c=narrow(c,d=>getDishFamily(d)!==ctx.avoidFam);
  if(!Array.isArray(pool)){
    const fitSet=new Set(pool.fit),normSet=new Set(pool.normal);
    const wantFit=Math.random()*100<pool.pct;
    c=narrow(c,d=>wantFit?fitSet.has(d):normSet.has(d));
  }
  if(ctx.invProt)c=narrow(c,d=>(getReceta(d)||[]).some(l=>isProteinCategory(l[3])&&(ctx.invProt[l[0].toLowerCase().trim()]||0)>0));
  const key=d=>ctx.slot+':'+d;
  const win=Math.min(ctx.slot==='C'?9:6,Math.max(0,c.length-1));
  c=narrow(c,d=>(ctx.i-(ctx.lastUsed[key(d)]??-99))>win);
  const minC=Math.min(...c.map(d=>ctx.usedCount[key(d)]||0));
  c=c.filter(d=>(ctx.usedCount[key(d)]||0)===minC);
  return c[Math.floor(Math.random()*c.length)];
}

function generateAll(opts={}){
  if(!S.startDate)S.startDate=todayStr();
  const keep=opts.keepApproved!==false;
  const hols=getHols();
  const prev=S.menu||{};
  const pct=S.fitPct||0;
  const pools={
    aS:buildMixedPool(S.platos.almuerzo_semana,S.platosFit.almuerzo_semana,pct),
    aF:buildMixedPool(S.platos.almuerzo_finde,S.platosFit.almuerzo_finde,pct),
    cS:buildMixedPool(S.platos.cena_semana,S.platosFit.cena_semana,pct),
    cF:buildMixedPool(S.platos.cena_finde,S.platosFit.cena_finde,pct),
    // Viernes noche: cenas de fin de semana + almuerzos de fin de semana
    cFri:buildMixedPool(
      [...new Set([...S.platos.cena_finde,...S.platos.almuerzo_finde])],
      [...new Set([...S.platosFit.cena_finde,...S.platosFit.almuerzo_finde])],pct)
  };
  const rep=!!S.repeatFortnight;
  // Con quincena repetida, los límites aplican a 14 días (luego se duplican)
  const N=periodDays(S.startDate),repFrom=addDays(firstMonday(S.startDate),14);
  const uniq=rep?Math.round((new Date(repFrom+'T12:00:00')-new Date(S.startDate+'T12:00:00'))/864e5):N;
  const sc=v=>Math.max(1,Math.round(v*uniq/28));
  const familyCounts={},maxFamily={Pescado:sc(3),Pollo:sc(8),Atun:sc(4)},usedCount={},lastUsed={};
  // Proteínas que ya estaban en casa (no compradas en este mercado) → se usan primero
  const invProt={};
  Object.entries(S.inventory||{}).forEach(([k,v])=>{
    if(!isProteinCategory(v.tipo))return;
    const pre=(v.qty||0)-(S.marketBought?.[k]||0);
    if(pre>0)invProt[k]=pre;
  });
  const useInv=Object.keys(invProt).length?invProt:null;
  const consume=dish=>{if(!useInv)return;(getReceta(dish)||[]).forEach(l=>{const k=l[0].toLowerCase().trim();if(isProteinCategory(l[3])&&invProt[k]>0)invProt[k]--;});};
  const note=(slot,d,i)=>{usedCount[slot+':'+d]=(usedCount[slot+':'+d]||0)+1;lastUsed[slot+':'+d]=i;};

  const menu={};let lastA='',lastC='',sobraWeek=false,kept=0;
  for(let i=0;i<N;i++){
    const ds=addDays(S.startDate,i);
    if(dayOfWeek(ds)===1)sobraWeek=false; // semanas lun–dom: máx 1 cena de sobras
    const wknd=isWeekend(ds,hols),fri=isFriday(ds),hol=hols.has(ds);
    const old=prev[ds];
    const kA=keep&&old?.confAlm&&old.almuerzo, kC=keep&&old?.confCena&&old.cena;
    const aPool=wknd?pools.aF:pools.aS;
    const cPool=(fri&&!wknd)?pools.cFri:wknd?pools.cF:pools.cS;

    // Repetir quincena: semana 3 = semana 1, semana 4 = semana 2 (si el tipo de día coincide)
    const src=rep&&ds>=repFrom?menu[addDays(ds,-14)]:null;
    const same=!!src&&src.wknd===wknd&&!!src.fri===!!fri;
    const cpA=same&&src.almuerzo!==SPECIAL_DISH?src.almuerzo:null;
    const cpC=same&&src.cena!==SPECIAL_DISH?src.cena:null;
    const almuerzo=kA?old.almuerzo:cpA?cpA:smartPick(aPool,lastA,{i,slot:'A',familyCounts,maxFamily,usedCount,lastUsed,invProt:useInv});
    const famA=getDishFamily(almuerzo);
    familyCounts[famA]=(familyCounts[famA]||0)+1;
    consume(almuerzo);

    let cena;
    if(kC){cena=old.cena;}
    else if(cpC){cena=cpC;}
    else{
      const sobra=(wknd||fri)?getCenaFromSobras(almuerzo):null;
      if(sobra&&!sobraWeek&&Math.random()<0.25){cena=sobra;}
      else cena=smartPick(cPool,lastC,{i,slot:'C',usedCount,lastUsed,avoidFam:famA,invProt:useInv});
    }
    const esSobra=isSobraDish(cena);
    if(esSobra)sobraWeek=true;
    consume(cena);
    note('A',almuerzo,i);note('C',cena,i);
    lastA=almuerzo;lastC=cena;
    if(kA)kept++;if(kC)kept++;
    menu[ds]={almuerzo,cena,wknd,fri,holiday:hol,
      confAlm:!!kA,confCena:!!kC,confirmed:!!(kA&&kC),
      cookedAlm:kA?!!old.cookedAlm:false,cookedCena:kC?!!old.cookedCena:false,
      fitAlm:isFitDish(almuerzo),fitCena:isFitDish(cena),esSobra};
  }
  S.menu=menu;
  if(opts.newPeriod){S.marketChecked={};S.marketBought={};}
  saveState();renderAll();
  S.currentWeek=Math.max(0,Math.min(S.currentWeek||0,getWeeks().length-1));
  if(rep&&!kept){toast('Menú propuesto · semanas 3 y 4 repiten la 1 y la 2');return;}
  toast(kept?`Nueva propuesta · se mantuvieron tus ${kept} platos aprobados`:`Menú propuesto: ${fmt(S.startDate)} al domingo ${fmt(periodEnd())} (${N} días)`);
}

function toggleRepeat(on){
  S.repeatFortnight=on;
  if(!on||!Object.keys(S.menu).length){saveState();renderCalendar();if(!on)toast('Desactivado: aplica la próxima vez que propongas el menú');return;}
  // Copiar semanas 1–2 a 3–4 respetando lo aprobado y el tipo de día
  let n=0,skip=0;
  const repFrom=addDays(firstMonday(S.startDate),14);
  for(const ds of menuDates().filter(d=>d>=repFrom)){
    const t=S.menu[ds],src=S.menu[addDays(ds,-14)];
    if(!t||!src)continue;
    if(src.wknd!==t.wknd||!!src.fri!==!!t.fri){skip++;continue;}
    if(!t.confAlm&&src.almuerzo!==SPECIAL_DISH){t.almuerzo=src.almuerzo;t.fitAlm=src.fitAlm;n++;}
    if(!t.confCena&&src.cena!==SPECIAL_DISH){t.cena=src.cena;t.fitCena=src.fitCena;t.esSobra=isSobraDish(t.cena);n++;}
    t.confirmed=!!(t.confAlm&&t.confCena);
  }
  saveState();renderAll();
  toast(`Semanas 3 y 4 ahora repiten la 1 y la 2 (${n} platos)${skip?` · ${skip} día(s) con festivo quedaron distintos`:''}`,4000);
}

function regenerateAll(){
  if(Object.keys(S.menu).length&&!confirm('¿Rehacer todo el menú desde cero? Se pierden las aprobaciones actuales.'))return;
  generateAll({keepApproved:false});
}

function setStartDate(v){
  if(!v||v===S.startDate){return;}
  const hadMenu=Object.keys(S.menu).length>0;
  const oldEnd=hadMenu?periodEnd():null;
  const newPeriod=!hadMenu||!oldEnd||v>oldEnd||v<addDays(S.startDate,-28);
  const msg=newPeriod
    ?`¿Empezar un período nuevo desde el ${fmtFull(v)}?\n\nSe propone un menú nuevo y la lista de mercado arranca de cero. El inventario se mantiene y se usa primero.`
    :`¿Mover el inicio al ${fmtFull(v)}?\n\nLos platos aprobados en fechas que sigan dentro del período se mantienen.`;
  if(hadMenu&&!confirm(msg)){renderCalendar();return;}
  S.startDate=v;S.purchaseDate=v;S.currentWeek=0;
  generateAll({newPeriod});
}

  document.getElementById('hdr-sub').textContent=total?`${fmt(S.startDate)} → ${fmt(end)} · ${conf}/${total} confirmados`:'Sin menú generado';
}

// CALENDAR — week-by-week semi-manual review
// ═══════════════════════════════════════════════════════════════
const DAY_NAMES=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];

function renderCalendar(){
  const hols=getHols();
  const today=todayStr();
  const total=Object.keys(S.menu).length;
  const conf=Object.values(S.menu).filter(d=>d.confirmed).length;
  const WEEKS=getWeeks();
  const currentWeek=Math.min(S.currentWeek||0,Math.max(0,WEEKS.length-1));
  const lastW=WEEKS.length-1;

  // Top controls
  let html=`<div class="ctrl-bar">
    <div class="cg">
      <label>Inicio</label>
      <input type="date" value="${S.startDate||today}" onchange="setStartDate(this.value)">
    </div>
    <div class="cg">
      <label title="Proporción de platos fit al proponer el menú">Platos fit <span id="fit-pct-lbl">${S.fitPct||0}</span>%</label>
      <input type="range" min="0" max="100" step="10" value="${S.fitPct||0}" oninput="S.fitPct=+this.value;document.getElementById('fit-pct-lbl').textContent=this.value" onchange="saveState();toast('Se aplicará la próxima vez que propongas el menú')" style="width:110px">
    </div>
    <div class="cg" style="justify-content:flex-end;padding-bottom:.2rem">
      <label class="switch" title="La semana 3 copia la semana 1 y la semana 4 copia la semana 2"><input type="checkbox" ${S.repeatFortnight?'checked':''} onchange="toggleRepeat(this.checked)"> Repetir quincena</label>
    </div>
    <div class="cg cg-approved" style="margin-left:auto">
      <label>Aprobados</label>
      <span style="font-size:.85rem;font-weight:500;color:${conf===total&&total?'var(--grn)':'var(--txt2)'}">${conf}/${total||'—'}</span>
    </div>
    <div style="display:flex;gap:.4rem;flex-wrap:wrap">
      ${total?`<button class="btn btn-warn btn-sm" onclick="regenerateAll()" title="Vuelve a proponer todo el período, incluso lo aprobado">🔄 Rehacer todo</button>`:''}
      <button class="btn btn-primary btn-sm" onclick="generateAll()" title="${conf?'Vuelve a proponer solo los platos no aprobados':''}">${total?(Object.values(S.menu).some(d=>d.confAlm||d.confCena)?'🎲 Proponer pendientes':'🎲 Proponer de nuevo'):'Proponer menú'}</button>
    </div>
  </div>`;

  if(!total){
    html+=`<div class="notice"><strong>Cómo funciona:</strong> 1) Elige la fecha de inicio y "Proponer menú". 2) Revisa semana a semana: aprueba o cambia cada plato. 3) Ve a 🛒 Mercado y marca lo que compras: eso llena el inventario. 4) Cada domingo mira 🧊 Meal Prep.</div>`;
    document.getElementById('panel-calendario').innerHTML=html;return;
  }

  // Progress bar
  html+=`<div class="progress-bar"><div class="progress-fill" style="width:${Math.round(conf/total*100)}%"></div></div>
  <p style="font-size:.7rem;color:var(--txt3);margin:.3rem 0 .9rem;font-family:monospace">${Math.round(conf/total*100)}% aprobado — toca un plato para cambiarlo. "Proponer pendientes" solo cambia lo no aprobado.</p>`;

  // Week navigation dots
  html+=`<div class="week-nav">
    <button class="week-nav-btn" onclick="setWeek(${currentWeek-1})" ${currentWeek===0?'disabled':''}>‹</button>
    <div class="week-dots">
      ${WEEKS.map((_,w)=>`<div class="week-dot${w===currentWeek?' active':''}" onclick="setWeek(${w})" title="${weekName(w)}"></div>`).join('')}
    </div>
    <button class="week-nav-btn" onclick="setWeek(${currentWeek+1})" ${currentWeek===lastW?'disabled':''}>›</button>
  </div>`;

  // Build the 7 days of the current week
  const weekDays=[];
  (WEEKS[currentWeek]||[]).forEach(ds=>weekDays.push({ds}));

  const weekConf=weekDays.filter(({ds})=>S.menu[ds]?.confirmed).length;
  const repFromD=addDays(firstMonday(S.startDate),14);
  const repSrc=S.repeatFortnight&&weekDays[0].ds>=repFromD?weekIndexOf(addDays(weekDays[0].ds,-14)):-1;
  const weekLabel=`${weekName(currentWeek)} — ${DAY_NAMES_SHORT[dayOfWeek(weekDays[0].ds)].toLowerCase()} ${fmt(weekDays[0].ds)} al dom ${fmt(weekDays[weekDays.length-1].ds)}${repSrc>=0?` · repite ${weekName(repSrc).toLowerCase()}`:''}`;

  html+=`<div class="week-card">
    <div class="week-header">
      <span class="week-title">${weekLabel}</span>
      <div style="display:flex;align-items:center;gap:.6rem">
        <span class="week-progress">${weekConf}/${weekDays.length} aprobados</span>
        ${weekConf===weekDays.length?`<span class="badge b-conf" style="font-size:.66rem;padding:2px 8px">✓ Semana aprobada</span>`:`<button class="btn btn-sm btn-warn" onclick="confirmWeek(${currentWeek})" style="font-size:.72rem;padding:.2rem .55rem">Aprobar semana</button>`}
      </div>
    </div>`;

  // Mezcla de proteínas de la semana
  const mix={};let especiales=0;
  weekDays.forEach(({ds})=>{const d=S.menu[ds];if(!d)return;[d.almuerzo,d.cena].forEach(x=>{if(x===SPECIAL_DISH){especiales++;return;}const f=getDishFamily(x);if(f!=='Otro')mix[f]=(mix[f]||0)+1;});});
  html+=`<div class="week-mix"><span>Proteínas:</span>${Object.entries(mix).sort((a,b)=>b[1]-a[1]).map(([f,n])=>`<span class="mix-chip${n>=5?' warn':''}">${FAMILY_LABEL[f]||f} ${n}</span>`).join('')||'<span>—</span>'}${especiales?`<span class="mix-chip">🍽️ ${especiales}</span>`:''}</div>`;

  weekDays.forEach(({ds})=>{
    const data=S.menu[ds];
    if(!data) return;
    const dw=dayOfWeek(ds);
    const isToday=ds===today;
    let rowCls='day-row';
    if(data.confirmed) rowCls+=' confirmed-row';
    else if(data.holiday) rowCls+=' holi-row';
    else if(data.wknd) rowCls+=' wknd-row';

    const badges=[];
    if(data.holiday) badges.push(`<span class="badge b-holi">${hols.name(ds)}</span>`);
    else if(data.wknd) badges.push(`<span class="badge b-fs">FS</span>`);
    else if(data.fri) badges.push(`<span class="badge b-fs" title="La cena del viernes es de fin de semana">noche FS</span>`);
    if(isToday) badges.push(`<span class="badge" style="background:var(--blu-l);color:var(--blu)">hoy</span>`);

    const confAlm=data.confAlm||false;
    const confCena=data.confCena||false;

    html+=`<div class="${rowCls}">
      <div class="day-col-date">
        <span class="dow">${DAY_NAMES[dw].slice(0,3)}</span>
        <span class="dnum">${fmt(ds)}</span>
        <div class="dbadges">${badges.join('')}</div>
      </div>
      <div class="meal-cell">
        <div class="meal-cell-lbl">
          Almuerzo
          ${data.fitAlm?`<span class="badge b-fit">fit</span>`:''}
          ${confAlm?`<span class="badge b-conf">✓</span>`:''}
        </div>
        <div class="meal-cell-name dish-link" onclick="openSwap('${ds}','alm')">${esc(data.almuerzo)}</div>
        <div class="meal-cell-actions">
          ${!confAlm?`<button class="act-btn" onclick="approveSlot('${ds}','alm')">✓ Aprobar</button>`:`<button class="act-btn confirmed" onclick="unapproveSlot('${ds}','alm')">✓ Aprobado</button>`}
          <button class="act-btn" onclick="openSwap('${ds}','alm')">↺ Cambiar</button>
        </div>
      </div>
      <div class="meal-cell">
        <div class="meal-cell-lbl">
          Cena
          ${data.fitCena?`<span class="badge b-fit">fit</span>`:''}
          ${isSobraDish(data.cena)?`<span class="badge" style="background:var(--amb-l);color:var(--amb)">sobras</span>`:''}
          ${confCena?`<span class="badge b-conf">✓</span>`:''}
        </div>
        <div class="meal-cell-name dish-link" onclick="openSwap('${ds}','cena')">${esc(data.cena)}</div>
        <div class="meal-cell-actions">
          ${!confCena?`<button class="act-btn" onclick="approveSlot('${ds}','cena')">✓ Aprobar</button>`:`<button class="act-btn confirmed" onclick="unapproveSlot('${ds}','cena')">✓ Aprobado</button>`}
          <button class="act-btn" onclick="openSwap('${ds}','cena')">↺ Cambiar</button>
        </div>
      </div>
    </div>`;
  });

  html+=`</div>`;

  // Week navigation bottom
  html+=`<div style="display:flex;justify-content:space-between;align-items:center;margin-top:.5rem">
    <button class="btn btn-sm" onclick="setWeek(${currentWeek-1})" ${currentWeek===0?'disabled':''} style="${currentWeek===0?'opacity:.3':''}">← Semana anterior</button>
    <span style="font-size:.75rem;color:var(--txt3)">${weekName(currentWeek)} · ${currentWeek+1} de ${WEEKS.length}</span>
    ${currentWeek<lastW
      ? `<button class="btn btn-sm btn-primary" onclick="setWeek(${currentWeek+1})">Siguiente semana →</button>`
      : `<button class="btn btn-primary btn-sm" onclick="finalizeMenu()">Listo → ver mercado</button>`
    }
  </div>`;

  html+=`<div style="margin-top:.75rem;font-size:.7rem;color:var(--txt3);display:flex;gap:.65rem;flex-wrap:wrap">
    <span><span class="badge b-fs">FS</span> Fin de semana</span>
    <span><span class="badge b-conf">✓</span> Aprobado</span>
    <span><span class="badge b-fit">fit</span> Plato fit</span>
    <span><span class="badge" style="background:var(--amb-l);color:var(--amb)">sobras</span> Cena con lo que sobró del almuerzo</span>
  </div>`;

  document.getElementById('panel-calendario').innerHTML=html;
}

function setWeek(w){
  if(w<0||w>getWeeks().length-1)return;
  S.currentWeek=w;
  saveState();
  renderCalendar();
}

function approveSlot(ds,slot){
  if(!S.menu[ds])return;
  if(slot==='alm') S.menu[ds].confAlm=true;
  else S.menu[ds].confCena=true;
  // Mark day confirmed when both approved
  if(S.menu[ds].confAlm&&S.menu[ds].confCena) S.menu[ds].confirmed=true;
  saveState();renderCalendar();renderResumen();updateHeader();
}

function unapproveSlot(ds,slot){
  if(!S.menu[ds])return;
  if(slot==='alm') S.menu[ds].confAlm=false;
  else S.menu[ds].confCena=false;
  S.menu[ds].confirmed=false;
  saveState();renderCalendar();renderResumen();updateHeader();
}

function confirmWeek(weekIdx){
  const W=getWeeks();
  (W[weekIdx]||[]).forEach(ds=>{const d=S.menu[ds];d.confAlm=true;d.confCena=true;d.confirmed=true;});
  if(weekIdx<W.length-1){S.currentWeek=weekIdx+1;toast(`${weekName(weekIdx)} aprobada → ${weekName(weekIdx+1).toLowerCase()}`);}
  else toast(`${weekName(weekIdx)} aprobada`);
  saveState();renderAll();window.scrollTo({top:0,behavior:'smooth'});
}

function finalizeMenu(){
  const total=Object.keys(S.menu).length;
  const conf=Object.values(S.menu).filter(d=>d.confirmed).length;
  if(conf<total){
    if(!confirm(`Aún tienes ${total-conf} días sin aprobar del todo. ¿Aprobar todo y continuar?`))return;
    Object.values(S.menu).forEach(d=>{d.confAlm=true;d.confCena=true;d.confirmed=true;});
  }
  saveState();renderAll();switchTab('mercado');
  toast('Menú listo · esta es tu lista de mercado');
}

function renderResumen(){
  const panel=document.getElementById('panel-resumen');
  const total=Object.keys(S.menu).length;
  if(!total){
    panel.innerHTML=`<div class="notice">Genera y finaliza el menú para ver el resumen en calendario.</div>`;
    return;
  }

  const hols=getHols();
  const today=todayStr();
  const conf=Object.values(S.menu).filter(d=>d.confirmed).length;

  let html=`<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.5rem;margin-bottom:1rem">
    <div>
      <p style="font-size:.8rem;color:var(--txt2)">${fmt(S.startDate)} → ${fmt(periodEnd())} · ${conf}/${total} confirmados</p>
      <p style="font-size:.7rem;color:var(--txt3)">Toca un plato para cambiarlo.</p>
    </div>
    <div style="display:flex;gap:.4rem">
      <button class="btn btn-sm" onclick="exportMenuPDF()">📄 Exportar PDF</button>

      <button class="btn btn-sm btn-primary" onclick="switchTab('mercado')">Ver mercado →</button>

  // 7-column grid header
  html+=`<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:.3rem;margin-bottom:.3rem">`;
  ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].forEach(n=>
    html+=`<div style="text-align:center;font-size:.65rem;color:var(--txt3);text-transform:uppercase;letter-spacing:.05em;font-family:monospace;padding:.25rem 0">${n}</div>`

  // Build grid: pad to start on correct DOW, then 28 days
  const startDow=(dayOfWeek(S.startDate)+6)%7, NDAYS=total;

  const rows=Math.ceil(totalCells/7);

  html+=`<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:.3rem" id="resumen-grid">`;

      html+=`<div style="background:var(--surf2);border-radius:var(--r);opacity:.25;min-height:90px"></div>`;
      continue;

    const ds=addDays(S.startDate,dayIdx);
    const data=S.menu[ds];
    const isToday=ds===today;

    let bg='var(--surf)';
    let border='.5px solid var(--brd)';
    if(data?.holiday){bg='var(--amb-l)';border='.5px solid var(--amb)';}

    if(isToday) border='2px solid var(--blu)';

    html+=`<div style="background:${bg};border:${border};border-radius:var(--r);padding:.38rem .42rem;min-height:90px;font-size:.68rem">`;

  }
  html+=`</div>`;

  // Legend
  html+=`<div style="margin-top:.65rem;font-size:.7rem;color:var(--txt3);display:flex;gap:.65rem;flex-wrap:wrap">
    <span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:2px;background:var(--grn-l);border:.5px solid var(--grn);display:inline-block"></span>Fin de semana</span>

  </div>`;

  // Mobile: list view using card classes
  let listHtml=`<div id="resumen-list">`;

    const data=S.menu[ds];

    const hdrBorder=isHoli?'var(--amb)':isWknd?'var(--grn)':'var(--brd)';
    const badge=isHoli
      ?`<span class="badge b-holi">${hols.name(ds)}</span>`
      :isWknd?`<span class="badge b-fs">FS</span>`:'';
    listHtml+=`<div class="resumen-day-card"${ds===today?' style="border:2px solid var(--blu)"':''}>

        <div style="display:flex;align-items:center;gap:.4rem">
          ${badge}

          <div class="resumen-slot-txt dish-link" onclick="openSwap('${ds}','cena')">${esc(data.cena)}</div>

function switchTab(name){
  const btn=document.querySelector(`.tab[data-tab="${name}"]`);if(!btn)return;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));

  try{localStorage.setItem('menuapp_tab',name);}catch(e){}
  window.scrollTo({top:0});
}

// Arma un PDF de texto (jsPDF) y usa el menú "Compartir" del teléfono/PC.
// Si el dispositivo no permite compartir archivos, lo descarga y abre WhatsApp para adjuntarlo.
let _pdfLibs=null;
function loadScript(src){return new Promise((res,rej)=>{const sc=document.createElement('script');sc.src=src;sc.onload=res;sc.onerror=()=>rej(new Error('Sin conexión para generar el PDF'));document.head.appendChild(sc);});}
function loadPdfLibs(){
  if(window.jspdf&&window.jspdf.jsPDF&&window.jspdf.jsPDF.API.autoTable)return Promise.resolve();
  if(!_pdfLibs)_pdfLibs=loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js')
    .then(()=>loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js'))
    .catch(e=>{_pdfLibs=null;throw e;});
  return _pdfLibs;
}
function pdfSafe(t){return String(t??'').replace(/[^\x00-\xFF–—·×‘’“”…•€]/gu,'').trim();}
function buildMenuPdf(){
  const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:'mm',format:'a4'});
  const GREEN=[15,110,86],LIGHT=[240,239,233],W=doc.internal.pageSize.getWidth();
  const hols=getHols(),title=`Menú ${fmt(S.startDate)} – ${fmt(periodEnd())}`;
  const header=(t,sub)=>{doc.setFont('helvetica','bold');doc.setFontSize(15);doc.setTextColor(26,26,24);doc.text(pdfSafe(t),12,15);
    if(sub){doc.setFont('helvetica','normal');doc.setFontSize(8.5);doc.setTextColor(140);doc.text(pdfSafe(sub),12,20.5);}};
  // 1) Calendario (lun–dom)
  header(title,'Calendario del menú');
  const dates=menuDates(),startDow=(dayOfWeek(dates[0])+6)%7,cells=[];
  for(let i=0;i<startDow;i++)cells.push(null);dates.forEach(d=>cells.push(d));while(cells.length%7)cells.push(null);
  const body=[];for(let r=0;r<cells.length;r+=7)body.push(cells.slice(r,r+7).map(ds=>{if(!ds)return'';const m=S.menu[ds];
    return pdfSafe(`${parseInt(ds.slice(8))}${m.holiday?' · '+hols.name(ds):''}\nAlm: ${m.almuerzo}\nCena: ${m.cena}`);}));
  doc.autoTable({startY:24,head:[['Lun','Mar','Mié','Jue','Vie','Sáb','Dom']],body,theme:'grid',
    styles:{fontSize:6.4,cellPadding:1.3,valign:'top',lineColor:[220,220,215]},bodyStyles:{minCellHeight:26},
    headStyles:{fillColor:GREEN,halign:'center',fontSize:8},margin:{left:8,right:8},
    didParseCell:d=>{if(d.section!=='body')return;const ds=cells[d.row.index*7+d.column.index];if(!ds){d.cell.styles.fillColor=[250,250,248];return;}
      const m=S.menu[ds];if(m.holiday)d.cell.styles.fillColor=[255,248,230];else if(m.wknd)d.cell.styles.fillColor=[236,248,242];}});
  // 2) Semana a semana
  doc.addPage();header(title,'Menú semana a semana');let y=25;
  getWeeks().forEach((wk,w)=>{
    if(y+14+wk.length*7>282){doc.addPage();y=15;}
    doc.autoTable({startY:y,head:[[{content:`${weekName(w)} · ${fmt(wk[0])} – ${fmt(wk[wk.length-1])}`,colSpan:3}],['Día','Almuerzo','Cena']],
      body:wk.map(ds=>{const m=S.menu[ds];return[pdfSafe(`${DAY_NAMES_SHORT[dayOfWeek(ds)]} ${fmt(ds)}${m.holiday?' ('+hols.name(ds)+')':''}`),pdfSafe(m.almuerzo),pdfSafe(m.cena)];}),
      theme:'striped',styles:{fontSize:8,cellPadding:1.6},headStyles:{fillColor:GREEN},columnStyles:{0:{cellWidth:26}},
      margin:{left:12,right:12},rowPageBreak:'avoid',pageBreak:'auto'});
    y=doc.lastAutoTable.finalY+6;
  });
  // 3) Lista de mercado (verduras según la vista elegida)
  doc.addPage();const Q=quincenas(),vv=S.vegView||'mes';
  header('Lista de mercado',`Compra: ${fmtFull(S.purchaseDate||S.startDate)} · Verduras y frutas: ${vv==='mes'?'mes completo':(vv==='q1'?'1ª':'2ª')+' quincena ('+fmt(Q[vv].from)+'–'+fmt(Q[vv].to)+')'}`);
  y=25;
  groupMarket(getMarketItems()).forEach(([store,cats])=>{
    const rows=[];cats.forEach(([cat,items])=>{rows.push([{content:pdfSafe(cat).toUpperCase(),colSpan:3,styles:{fillColor:LIGHT,fontStyle:'bold',fontSize:7,textColor:[110,110,105]}}]);
      items.forEach(it=>rows.push([(S.marketChecked[it.key]?'[x] ':'[  ] ')+pdfSafe(it.name),pdfSafe(fmtQty(it)),pdfSafe(freshnessInfo(it.minDate||S.purchaseDate,it.purchase).label)]));});
    doc.autoTable({startY:y,head:[[{content:pdfSafe(store),colSpan:3}]],body:rows,theme:'plain',styles:{fontSize:8,cellPadding:1.2},
      headStyles:{fillColor:GREEN,textColor:255,fontSize:9.5},columnStyles:{0:{cellWidth:62},1:{cellWidth:62,textColor:GREEN},2:{textColor:[130,130,125],fontSize:7}},margin:{left:12,right:12}});
    y=doc.lastAutoTable.finalY+5;
  });
  const n=doc.getNumberOfPages();for(let i=1;i<=n;i++){doc.setPage(i);doc.setFontSize(7);doc.setTextColor(160);doc.text(`${i} / ${n}`,W/2,290,{align:'center'});}
  return doc;
}
async function shareMenuPdf(){
  if(!Object.keys(S.menu).length){toast('Genera el menú primero');return;}
  toast('Generando PDF…',6000);
  try{
    await loadPdfLibs();
    const filename=`Menu_${S.startDate}_${periodEnd()}.pdf`;
    const blob=buildMenuPdf().output('blob');
    const file=new File([blob],filename,{type:'application/pdf'});
    const text=`Menú ${fmt(S.startDate)} – ${fmt(periodEnd())}`;
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file],title:text,text});}
      catch(e){if(e.name!=='AbortError')throw e;}
    } else {
      const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),2000);
      openModal(`<h2>📲 PDF listo</h2>
        <p style="font-size:.82rem;color:var(--txt2);line-height:1.6">Este navegador no permite enviar archivos directo a WhatsApp, así que el PDF <strong>${esc(filename)}</strong> se descargó.<br>Abre WhatsApp, elige el chat y adjúntalo con el clip 📎.</p>
        <div class="modal-footer"><button class="btn btn-sm" onclick="closeModal()">Cerrar</button>
        <button class="btn btn-sm btn-primary" onclick="window.open('https://web.whatsapp.com/','_blank');closeModal()">Abrir WhatsApp Web</button></div>`);
    }
  }catch(e){toast('No se pudo generar el PDF: '+e.message,5000);console.error(e);}
}

function openSwap(ds,slot){
  const data=S.menu[ds];if(!data)return;
  _swapDs=ds; _swapSlot=slot;
  const isAlm=slot==='alm';
  const current=isAlm?data.almuerzo:data.cena;

  // Suggestions pool: respects day type (semana vs finde)
  const dayPool=isAlm
    ?(data.wknd
      ?[...S.platos.almuerzo_finde,...S.platosFit.almuerzo_finde]
      :[...S.platos.almuerzo_semana,...S.platosFit.almuerzo_semana])
    :((data.wknd||data.fri)
      ?[...S.platos.cena_finde,...S.platosFit.cena_finde,
        ...((data.fri&&!data.wknd)?[...S.platos.almuerzo_finde,...S.platosFit.almuerzo_finde]:[])]
      :[...S.platos.cena_semana,...S.platosFit.cena_semana]);
  _swapPool=[...new Set(dayPool)];

  // Search pool: ALL dishes of this meal category (semana + finde + fit)
  const searchPool=isAlm
    ?[...S.platos.almuerzo_semana,...S.platos.almuerzo_finde,
      ...S.platosFit.almuerzo_semana,...S.platosFit.almuerzo_finde]
    :[...S.platos.cena_semana,...S.platos.cena_finde,
      ...S.platosFit.cena_semana,...S.platosFit.cena_finde,
      ...S.platos.almuerzo_finde,...S.platosFit.almuerzo_finde];
  _swapSearchPool=[...new Set(searchPool)];

  _swapExcluded=new Set([current]);

  document.getElementById('modal-box').innerHTML=`
    <h2>Cambiar ${isAlm?'almuerzo':'cena'} — ${DAY_NAMES[dayOfWeek(ds)]} ${fmt(ds)}</h2>
    <p style="font-size:.78rem;color:var(--txt2);margin-bottom:.75rem">Actual: <strong>${esc(current)}</strong>${getReceta(current)?` · <a href="#" onclick="event.preventDefault();openRecipeEditor(decodeURIComponent('${enc(current)}'))" style="color:var(--grn-d)">ver receta</a>`:''}</p>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:.4rem">
      <span class="section-ttl" style="margin:0">Sugerencias</span>
      <button class="btn btn-sm" onclick="refreshSuggestions()" style="font-size:.7rem">↺ Otras opciones</button>
    </div>
    <div id="sugg-container" style="margin-bottom:.4rem"></div>
    <div class="sugg-chip" style="border-style:dashed;margin:0 0 .9rem 0" onclick="doSwap(SPECIAL_DISH)">${SPECIAL_DISH}</div>
    <div class="section-ttl">Buscar en todos los platos <span style="font-size:.65rem;color:var(--txt3);text-transform:none;letter-spacing:0;font-family:inherit">(${_swapSearchPool.length} disponibles)</span></div>
    <input class="search-input" type="text" id="swap-search" placeholder="Plato o proteína: carne molida, pollo, pasta..." oninput="filterSwap(this.value)">
    <select class="search-input" id="swap-select" onchange="pickFromSelect(this)">${buildSwapSelectOptions()}</select>
    <div id="swap-results" class="search-results" style="display:none"></div>
    <div class="modal-footer">
      ${(isAlm?data.confAlm:data.confCena)?'':`<button class="btn btn-sm" onclick="approveSlot('${ds}','${slot}');closeModal()">✓ Dejarlo y aprobar</button>`}
      <button class="btn btn-sm" onclick="closeModal()">Cancelar</button>
    </div>`;
  document.getElementById('modal-overlay').style.display='flex';
  renderSuggestions();
}

function getSuggestions(){
  const data=S.menu[_swapDs];
  const curFam=getDishFamily(_swapSlot==='alm'?data.almuerzo:data.cena);
  const candidates=_swapPool.filter(d=>!_swapExcluded.has(d));
  // Shuffle candidates for variety
  const shuffled=[...candidates].sort(()=>Math.random()-.5);
  const suggestions=[];
  const seenFams=new Set([curFam]);
  // Prefer different families
  for(const d of shuffled){
    const f=getDishFamily(d);
    if(!seenFams.has(f)){seenFams.add(f);suggestions.push(d);}
    if(suggestions.length>=3)break;
  }
  // Fill with any remaining
  for(const d of shuffled){
    if(suggestions.length>=3)break;
    if(!suggestions.includes(d))suggestions.push(d);
  }
  return suggestions;
}

function renderSuggestions(){
  const suggestions=getSuggestions();
  const container=document.getElementById('sugg-container');
  if(!container)return;
  if(!suggestions.length){
    container.innerHTML=`<p style="font-size:.78rem;color:var(--txt3)">No hay más opciones disponibles.</p>`;
    return;
  }
  container.innerHTML=suggestions.map((s,i)=>
    `<div class="sugg-chip" onclick="pickSuggestion(${i})" data-dish="${encodeURIComponent(s)}">${esc(s)}</div>`
  ).join('');
}

function refreshSuggestions(){
  // Add current suggestions to excluded so we don't repeat them
  const chips=document.querySelectorAll('#sugg-container .sugg-chip');
  chips.forEach(c=>{
    const dish=decodeURIComponent(c.getAttribute('data-dish'));
    _swapExcluded.add(dish);
  });
  // If we've excluded too many, reset (keep only current dish excluded)
  if(_swapPool.filter(d=>!_swapExcluded.has(d)).length<3){
    const data=S.menu[_swapDs];
    const current=_swapSlot==='alm'?data.almuerzo:data.cena;
    _swapExcluded=new Set([current]);
  }
  renderSuggestions();
}

function pickSuggestion(idx){
  const chips=document.querySelectorAll('#sugg-container .sugg-chip');
  const dish=chips[idx]?decodeURIComponent(chips[idx].getAttribute('data-dish')):null;
  if(dish)doSwap(dish);
}

function dishProteins(d){
  const lines=[...(getReceta(d)||[]),...(isSobraDish(d)?(sobraProteinLines(d)||[]):[])];
  return [...new Set(lines.filter(l=>isProteinCategory(l[3])||/^(at[uú]n|jam[oó]n|tocineta|huevos?)$/i.test(String(l[0]).split(' ')[0])).map(l=>l[0]))];
}
function dishProteinText(d){const f=getDishFamily(d);return dishProteins(d).join(' ')+' '+(f!=='Otro'?FAMILY_LABEL[f]||'':'');}
function filterSwap(query){
  const res=document.getElementById('swap-results');
  if(!query.trim()){res.style.display='none';return;}
  const q=norm(query);
  // Search across ALL dishes of this meal type (sin tildes, todas las palabras)
  const words=q.split(/\s+/).filter(Boolean);
  // Busca por nombre del plato o por la proteína que usa (ej. "carne molida", "pollo", "cerdo")
  // Coincidencia por inicio de palabra (así "pollo" no encuentra "repollo")
  const wordsOf=t=>norm(t).split(/[^a-z0-9ñ]+/).filter(Boolean);
  const hit=(toks,w)=>toks.some(x=>x.startsWith(w));
  const matches=_swapSearchPool.filter(d=>{
    if(words.every(w=>hit(wordsOf(d),w)))return true;
    const pt=dishProteinText(d);
    return words.length>1?(' '+wordsOf(pt).join(' ')+' ').includes(' '+words.join(' ')):hit(wordsOf(pt),q);
  });
  if(!matches.length){
    res.innerHTML=`<div style="padding:.5rem .75rem;font-size:.78rem;color:var(--txt3)">Sin resultados para "${esc(query)}". Puedes crear el plato en 📖 Recetas.</div>`;
    res.style.display='block';return;
  }
  res.innerHTML=matches.map(d=>{
    // Mark if this dish is outside the day's normal pool (semana vs finde)
    const inDayPool=_swapPool.includes(d);
    const prots=dishProteins(d);
    const byProt=!words.every(w=>wordsOf(d).some(x=>x.startsWith(w)))&&prots.length;
    const note=(byProt?` <span style="font-size:.66rem;color:var(--grn-d)">· ${esc(prots.join(', '))}</span>`:'')+(inDayPool?'':' <span style="font-size:.62rem;color:var(--amb);font-family:monospace">otro tipo</span>');
    return`<div class="search-result-item" data-dish="${encodeURIComponent(d)}" onclick="pickResult(this)">${esc(d)}${note}</div>`;
  }).join('');
  res.style.display='block';
}

function buildSwapSelectOptions(){
  const inDay=_swapSearchPool.filter(d=>_swapPool.includes(d)&&!_swapExcluded.has(d)).sort((x,y)=>x.localeCompare(y,'es'));
  const other=_swapSearchPool.filter(d=>!_swapPool.includes(d)&&!_swapExcluded.has(d)).sort((x,y)=>x.localeCompare(y,'es'));
  const opt=d=>`<option value="${encodeURIComponent(d)}">${d.replace(/</g,'&lt;')}</option>`;
  return `<option value="">▾ Ver todos los platos (${inDay.length+other.length})…</option>`
    +`<option value="${encodeURIComponent(SPECIAL_DISH)}">${SPECIAL_DISH}</option>`
    +(inDay.length?`<optgroup label="Recomendados para este día (${inDay.length})">${inDay.map(opt).join('')}</optgroup>`:'')
    +(other.length?`<optgroup label="Otros platos (${other.length})">${other.map(opt).join('')}</optgroup>`:'');
}
function pickFromSelect(el){
  if(!el.value)return;
  doSwap(decodeURIComponent(el.value));
}

function pickResult(el){
  const dish=decodeURIComponent(el.getAttribute('data-dish'));
  doSwap(dish);
}

function doSwap(dish){
  const d=S.menu[_swapDs];if(!d||!dish)return;
  if(_swapSlot==='alm'){
    const wasSobra=isSobraDish(d.cena)&&d.cena===getCenaFromSobras(d.almuerzo);
    d.almuerzo=dish;d.confAlm=false;d.cookedAlm=false;d.fitAlm=isFitDish(dish);
    if(wasSobra){
      const ns=getCenaFromSobras(dish);
      if(ns){d.cena=ns;d.confCena=false;toast('La cena de sobras se ajustó al nuevo almuerzo');}
      else toast('Ojo: la cena era sobras del almuerzo anterior. Revísala.',4000);
    }
  } else {
    d.cena=dish;d.confCena=false;d.cookedCena=false;d.fitCena=isFitDish(dish);
  }
  d.esSobra=isSobraDish(d.cena);
  d.confirmed=!!(d.confAlm&&d.confCena);
  const fm=firstMonday(S.startDate);
  if(S.repeatFortnight&&_swapDs>=fm&&_swapDs<addDays(fm,14)){
    const tds=addDays(_swapDs,14),t=S.menu[tds];
    if(t&&t.wknd===d.wknd&&!!t.fri===!!d.fri){
      const f=_swapSlot==='alm'?'almuerzo':'cena',cf=_swapSlot==='alm'?'confAlm':'confCena';
      if(!t[cf]){t[f]=d[f];if(_swapSlot==='alm'){t.fitAlm=d.fitAlm;if(d.esSobra&&!t.confCena){t.cena=d.cena;t.esSobra=true;}}else{t.fitCena=d.fitCena;t.esSobra=d.esSobra;}t.confirmed=!!(t.confAlm&&t.confCena);toast(`También cambiado en la ${weekName(weekIndexOf(tds)).toLowerCase()} (${fmt(tds)})`);}
    }
  }
  closeModal();saveState();renderAll();
}

function closeModal(){document.getElementById('modal-overlay').style.display='none';document.getElementById('modal-box').innerHTML='';}
function closeModalOutside(e){if(e.target===document.getElementById('modal-overlay'))closeModal();}

function prepSundayFor(ds){const dw=dayOfWeek(ds);return addDays(ds,-(dw===0?7:dw));}
// Bloques de meal prep: 'lun' = lun–dom (prep el domingo), 'jue' = jue–mié (prep el miércoles),
// 'ambos' = lun–mié y jue–dom (prep domingo y miércoles)
function prepBlockStart(ds){
  const m=S.prepMode||'lun',dw=dayOfWeek(ds);
  if(m==='jue')return addDays(ds,-((dw+3)%7));
  if(m==='ambos')return (dw>=1&&dw<=3)?addDays(ds,-(dw-1)):addDays(ds,-((dw+3)%7));
  return addDays(ds,-((dw+6)%7));
}
function setPrepMode(v){S.prepMode=v;saveState();renderMealPrep();}

  </div>
  <div class="notice">🧊 El día anterior a cada bloque saca del congelador estas porciones. Cada porción = un plato. Las proteínas repetidas se cocinan juntas y se separan por salsa o acompañamiento.</div>`;

      </div>`;
    if(!entries.length){html+=`<p style="font-size:.8rem;color:var(--txt3)">Sin proteínas esta semana.</p></div>`;return;}
    html+=`<div style="display:flex;flex-direction:column;gap:.35rem">`;

      html+=`<div style="display:flex;align-items:center;gap:.5rem;font-size:.86rem"><span class="prep-dot"></span><span style="flex:1">${esc(p.name)}</span><strong style="font-family:monospace;color:var(--grn-d)">× ${p.dishes.length}</strong></div>`;

const MES_CORTO=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

function freshnessInfo(firstUseDate,purchaseOverride){
  const purchDate=purchaseOverride||S.purchaseDate||S.startDate||todayStr();
  const pu=new Date(purchDate+'T12:00:00');
  const fu=new Date(firstUseDate+'T12:00:00');
  const lag=Math.max(0,Math.round((fu-pu)/(1000*60*60*24)));
  const d=fu.getDate(), m=MES_CORTO[fu.getMonth()];
  const buyLaterDate=addDays(firstUseDate,-3);
  const buyLaterD=new Date(buyLaterDate+'T12:00:00').getDate();
  const buyLaterM=MES_CORTO[new Date(buyLaterDate+'T12:00:00').getMonth()];

  let cls,label;
  if(lag===0){cls='fresh-ok';label=`Usar el ${d} de ${m}`;}
  else if(lag<=3){cls='fresh-ok';label=`Usar antes del ${d} de ${m}`;}
  else if(lag<=7){cls='fresh-good';label=`Usar antes del ${d} de ${m}`;}
  else if(lag<=14){cls='fresh-warn';label=`Usar antes del ${d} de ${m} — planificar`;}
  else{cls='fresh-crit';label=`Comprar después del ${buyLaterD} de ${buyLaterM} — usar el ${d} de ${m}`;}
  return{cls,label,lag};
}

function setPurchaseDate(val){S.purchaseDate=val;saveState();renderMarket();}

// MARKET — proteins as "Xg × N porciones", rest in natural units
// ═══════════════════════════════════════════════════════════════
const STORE_PREF=['Carnicería','Plaza','Éxito','Santa Reyes','D1','Artesa'];
const CAT_PREF=['Pollo','Carne Cerdo','Carne Res','Pescado','Huevos','Lácteos','Carnes frías','Verdura','Fruta','Despensa','Congelados','Otro'];
function orderBy(pref,keys){return [...pref.filter(k=>keys.includes(k)),...keys.filter(k=>!pref.includes(k)).sort()];}
// totals -> [[store,[[cat,[items]]]]] (todas las tiendas/categorías, nunca descarta)
function groupMarket(totals){
  const by={};
  Object.entries(totals).forEach(([key,it])=>{const st=it.tienda||'Otro',c=it.tipo||'Otro';(by[st]=by[st]||{});(by[st][c]=by[st][c]||[]).push({key,...it});});
  return orderBy(STORE_PREF,Object.keys(by)).map(st=>[st,orderBy(CAT_PREF,Object.keys(by[st])).map(c=>[c,by[st][c].sort((a,b)=>a.name.localeCompare(b.name,'es'))])]);
}

// Platos de un día con sus líneas de receta. Una cena de sobras suma
// una porción extra de la proteína del almuerzo (se cocina de más).
function getDayMeals(ds){
  const d=S.menu[ds];if(!d)return[];
  const out=[];
  [['alm',d.almuerzo],['cena',d.cena]].forEach(([slot,dish])=>{
    if(!dish||dish===SPECIAL_DISH)return;
    let lines=[...(getReceta(dish)||[])];
    const sobra=slot==='cena'&&isSobraDish(dish);
    if(sobra)lines=lines.concat(sobraProteinLines(dish)||[]);
    out.push({slot,dish,lines,sobra});
  });
  return out;
}

function computeMarketTotals(subtractInv=true,range=null,ckSuffix=''){
  const totals={};
  const STORE_NORM={'Exito':'Éxito','exito':'Éxito','EXITO':'Éxito'};
  function addIng(ing,qty,unit,tipo,tienda,ds){
    const key=String(ing).toLowerCase().trim();
    const isProt=isProteinCategory(tipo);
    if(!totals[key])totals[key]={name:ing,qty:0,unit:unit||'unid',tipo:tipo||'Otro',tienda:STORE_NORM[tienda]||tienda||'Otro',minDate:ds,portions:{},portionCount:0};
    const t=totals[key];
    if(unit==='al gusto'&&!isProt){ /* se compra una vez: no suma */ }
    else if(!isProt&&unit&&t.unit!==unit){t.extra=t.extra||{};t.extra[unit]=(t.extra[unit]||0)+(Number(qty)||0);}
    else t.qty+=Number(qty)||0;
    if(isProt){t.portionCount++;const pk=`${qty}|${unit||'g'}`;t.portions[pk]=(t.portions[pk]||0)+1;}
    if(ds<t.minDate)t.minDate=ds;
  }
  const days=Object.keys(S.menu).sort().filter(ds=>!range||(ds>=range.from&&ds<=range.to));
  days.forEach(ds=>getDayMeals(ds).forEach(m=>m.lines.forEach(([ing,qty,unit,tipo,tienda])=>addIng(ing,qty,unit,tipo,tienda,ds))));
  const sd=range?range.from:(S.startDate||todayStr());
  const frac=range?Math.min(1,days.length/Math.max(1,Object.keys(S.menu).length)):1;
  FIJOS_BASE.forEach(([ing,qty,unit,tipo,tienda])=>addIng(ing,range?Math.ceil(qty*frac*10)/10:qty,unit,tipo,tienda,sd));
  Object.values(totals).forEach(t=>{if(t.portionCount)t.portionQty=parseFloat(Object.entries(t.portions).sort((a,b)=>b[1]-a[1])[0][0]);});

  // Descontar lo que YA había en casa (no lo comprado en este mercado)
  if(subtractInv&&S.useInventory){
    Object.entries(totals).forEach(([key,t])=>{
      const inv=S.inventory[key];if(!inv)return;
      const pre=Math.round(((inv.qty||0)-boughtFor(key))*10)/10;
      if(!(pre>0))return;
      t.atHome=pre;
      if(isProteinCategory(t.tipo)){
        let left=Math.min(Math.floor(pre),t.portionCount);
        for(const sz of Object.keys(t.portions).sort((a,b)=>parseFloat(a)-parseFloat(b))){const take=Math.min(left,t.portions[sz]);t.portions[sz]-=take;left-=take;if(!t.portions[sz])delete t.portions[sz];}
        t.portionCount=Object.values(t.portions).reduce((a,b)=>a+b,0);
        t.qty=Object.entries(t.portions).reduce((a,[sz,n])=>a+parseFloat(sz)*n,0);
        if(!t.portionCount&&!S.marketChecked[key+ckSuffix])delete totals[key];
      } else {
        t.qty=Math.max(0,t.qty-pre);
        if(t.qty<=0.001&&!S.marketChecked[key+ckSuffix])delete totals[key];
      }
    });
  }
  return totals;
}

function boughtFor(base){let n=0;Object.entries(S.marketBought||{}).forEach(([k,v])=>{if(k===base||k.startsWith(base+'@'))n+=v||0;});return n;}
const VEG_TIPOS=new Set(['Verdura','Fruta']);
// ── Exportar verduras y frutas a WhatsApp ──
function waQty(it){
  const parts=[[it.qty,it.unit],...Object.entries(it.extra||{}).map(([u,q])=>[q,u])].filter(([q,u])=>u!=='al gusto'&&q>0);
  if(!parts.length)return 'al gusto';
  const SG={libra:['libra','libras'],unid:['unidad','unidades'],cabeza:['cabeza','cabezas'],manojo:['manojo','manojos'],tallos:['tallo','tallos'],taza:['taza','tazas'],bolsa:['bolsa','bolsas'],canasta:['canasta','canastas'],ramo:['ramo','ramos'],trozo:['trozo','trozos']};
  return parts.map(([q,u])=>{const n=u==='taza'?Math.round(q*10)/10:u==='libra'?Math.ceil(q*2-0.05)/2:Math.ceil(q-0.05);const w=SG[u]||[u,u];return `${String(n).replace('.',',')} ${n===1?w[0]:w[1]}`;}).join(' + ');
}
function vegWhatsappText(){
  const items=Object.entries(getMarketItems()).filter(([k,it])=>VEG_TIPOS.has(it.tipo)&&!S.marketChecked[k]).map(([,it])=>it);
  const sec=(tipo,title)=>{const l=items.filter(i=>i.tipo===tipo).sort((a,b)=>a.name.localeCompare(b.name,'es'));return l.length?`${title}:\n`+l.map(i=>`${i.name} - ${waQty(i)}`).join('\n'):'';};
  return [sec('Verdura','Verduras'),sec('Fruta','Frutas')].filter(Boolean).join('\n\n');
}
function openWhatsappExport(){
  const txt=vegWhatsappText();
  const Q=quincenas(),vv=S.vegView||'mes';
  const lbl=vv==='mes'?'mes completo':`${vv==='q1'?'1ª':'2ª'} quincena (${fmt(Q[vv].from)}–${fmt(Q[vv].to)})`;

async function copyWhatsapp(){
  const ta=document.getElementById('wa-text');if(!ta)return;
  try{await navigator.clipboard.writeText(ta.value);}catch(e){ta.select();document.execCommand('copy');}
  toast('Lista copiada');
}
// Lista que se muestra: todo mensual, salvo verduras/frutas si se eligió una quincena.
// Las llaves de verduras por quincena llevan sufijo @q1 / @q2 (se marcan por separado).
function getMarketItems(){
  const base=computeMarketTotals(true);
  const v=S.vegView||'mes',Q=quincenas();
  if(v==='mes'||!Q)return base;
  const out={};
  Object.entries(base).forEach(([k,it])=>{if(!VEG_TIPOS.has(it.tipo))out[k]=it;});
  const vt=computeMarketTotals(true,Q[v],'@'+v);
  Object.entries(vt).forEach(([k,it])=>{if(VEG_TIPOS.has(it.tipo))out[k+'@'+v]={...it,baseKey:k,purchase:v==='q2'?Q.q2.from:undefined};});
  return out;
}
function setVegView(v){S.vegView=v;saveState();renderMarket();}

// Cuánto hay en casa de lo anterior al mercado actual (para el switch)
function preexistingStock(){
  const need=computeMarketTotals(false);let n=0;
  Object.keys(need).forEach(k=>{const inv=S.inventory[k];if(inv&&((inv.qty||0)-boughtFor(k))>0)n++;});
  return n;
}

function fmtQty(item){
  if(item.extra){const main=item.qty>0?fmtQty({...item,extra:null}):'';const ex=Object.entries(item.extra).filter(([u])=>u!=='al gusto').map(([u,q])=>fmtQty({qty:q,unit:u,tipo:item.tipo}));return [main,...ex].filter(Boolean).join(' + ')||'al gusto';}
  if(isProteinCategory(item.tipo)&&item.portionCount>0){
    const ps=item.portions&&Object.keys(item.portions).length?item.portions:{[`${item.portionQty||Math.round(item.qty/(item.portionCount||1))}|g`]:item.portionCount};
    let anyG=false;
    const parts=Object.entries(ps).sort((a,b)=>b[1]-a[1]).map(([k,n])=>{const [q,u='g']=String(k).split('|');const qn=parseFloat(q);
      if(u==='g'){anyG=true;return `${Math.round(qn)}g × ${n}`;}
      return `${qn===1?u:`${String(qn).replace('.',',')} ${u}`} × ${n}`;});
    return parts.join(' + ')+(anyG&&parts.length===1?' porc.':'');
  }
  if(item.unit==='al gusto')return 'al gusto';
  const q=item.qty;
  if(item.unit==='g'){return q>=1000?`${(Math.round(q/100)/10).toString().replace('.',',')} kg`:`${Math.round(q)} g`;}
  if(item.unit==='ml'){return q>=1000?`${(Math.round(q/100)/10).toString().replace('.',',')} L`:`${Math.round(q)} ml`;}
  const n=item.unit==='libra'?Math.ceil(q*2-0.05)/2:(item.unit==='unid'||(VEG_TIPOS.has(item.tipo)&&item.unit!=='taza'))?Math.ceil(q-0.05):Math.round(q*10)/10;
  const PL={libra:'libras',cabeza:'cabezas',ramo:'ramos',taza:'tazas',pote:'potes',rama:'ramas',lata:'latas',paquete:'paquetes',bolsa:'bolsas',manojo:'manojos',botella:'botellas',trozo:'trozos',frasco:'frascos',canasta:'canastas',bloque:'bloques'};
  const u=n>1&&PL[item.unit]?PL[item.unit]:item.unit;
  return`${n%1===0?n:n.toFixed(1).replace('.',',')} ${u}`;
}

function renderMarket(){
